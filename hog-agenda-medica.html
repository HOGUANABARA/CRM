<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOG Gestão — Agenda Médica</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#fff;color:#212529;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  /* barra de agendas lógicas (padrão VoxComm) */
  .agbar{background:#dce9f7;padding:7px 10px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;flex-shrink:0;border-bottom:1px solid #c5d9ee;max-height:34vh;overflow-y:auto;}
  .agbar a{padding:6px 13px;color:#1a3d5c;text-decoration:none;font-size:14px;cursor:pointer;border-radius:3px;white-space:nowrap;}
  .agbar a:hover{background:#fff;}
  .agbar a.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .agbar a.verTodas{color:#0d6efd;font-size:13px;border-left:1px solid #b9cfe4;margin-left:6px;}
  .chipm{border:1px solid #ced4da;border-radius:999px;padding:.3rem .8rem;font-size:13px;cursor:pointer;background:#fff;}
  .chipm.on{background:#0d6efd;border-color:#0d6efd;color:#fff;font-weight:600;}
  .chipm[data-v=criado].on{background:#dc3545;border-color:#dc3545;}
  /* navegação de dia */
  .daybar{background:#dce9f7;padding:9px;display:flex;justify-content:center;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .daybar input[type=date]{padding:6px 9px;border:1px solid #b9c9d8;border-radius:4px;font-size:14px;}
  .bl{background:#4a90d9;color:#fff;border:none;padding:7px 15px;border-radius:4px;font-size:14px;cursor:pointer;}
  .bl:hover{background:#3d7cbd;}
  .status{position:absolute;right:12px;top:8px;font-size:11px;padding:3px 9px;border-radius:9px;font-weight:600;z-index:5;}
  .ok{background:#E4F7EC;color:#0F6A30;} .er{background:#FDE7E9;color:#C0122A;} .ld{background:#FEF3D6;color:#9A5700;}
  /* cabeçalho da agenda */
  .head{display:flex;justify-content:center;align-items:center;gap:12px;padding:9px;flex-wrap:wrap;flex-shrink:0;}
  .badge-med{background:#e8564f;color:#fff;padding:7px 15px;border-radius:5px;font-size:15px;font-weight:500;}
  .head .dt{font-size:16px;font-weight:600;color:#212529;}
  .ico{background:none;border:none;font-size:17px;cursor:pointer;color:#495057;}
  .wrap{flex:1;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{background:#fff;text-align:left;padding:9px 8px;font-weight:600;color:#212529;border-bottom:2px solid #dee2e6;white-space:nowrap;font-size:13.5px;}
  tbody td{padding:9px 8px;border-bottom:1px solid #e9ecef;vertical-align:middle;}
  tbody tr:nth-child(even){background:#f5f5f5;}
  tbody tr:hover{background:#eaf3fb;}
  .num{color:#6c757d;width:28px;text-align:center;}
  .bt-ag{background:#ffcd39;color:#212529;border:none;padding:6px 13px;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .bt-ag:hover{background:#ffc107;}
  .bt-d{background:#4a90d9;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer;}
  .bt-d:hover{background:#3d7cbd;}
  .bt-g{background:#28a745;color:#fff;border:none;padding:5px 10px;border-radius:4px;font-size:12.5px;cursor:pointer;}
  .bt-r{background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:4px;font-size:12.5px;cursor:pointer;}
  .bt-n{background:#e9ecef;color:#495057;border:none;padding:5px 10px;border-radius:4px;font-size:12.5px;cursor:pointer;}
  .pac{font-weight:700;color:#212529;text-transform:uppercase;font-size:14px;}
  .sub{color:#495057;font-size:13px;margin-top:1px;}
  .hr{white-space:nowrap;color:#212529;}
  .who{color:#495057;font-size:13px;white-space:nowrap;}
  .tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;}
  .t-g{background:#d4edda;color:#155724;} .t-r{background:#f8d7da;color:#721c24;}
  .t-a{background:#fff3cd;color:#856404;} .t-b{background:#d1ecf1;color:#0c5460;} .t-n{background:#e9ecef;color:#495057;}
  .empty{padding:40px;text-align:center;color:#adb5bd;font-style:italic;}
  .alerta{margin:0 10px 8px;background:#fff3cd;border:1px solid #ffc107;border-radius:5px;padding:8px 12px;font-size:13px;color:#856404;}
  .alerta.info{background:#d1ecf1;border-color:#17a2b8;color:#0c5460;}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:34px 14px;overflow-y:auto;}
  .ov.on{display:flex;}
  .mdl{background:#fff;border-radius:6px;width:100%;max-width:640px;box-shadow:0 8px 30px rgba(0,0,0,.3);}
  .mh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #dee2e6;}
  .mh b{font-size:16px;} .mh button{background:none;border:none;font-size:20px;cursor:pointer;color:#6c757d;}
  .mb{padding:15px 16px;} .mf{padding:11px 16px;border-top:1px solid #dee2e6;display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:10px;}
  label{font-size:12px;color:#495057;display:block;margin-bottom:3px;font-weight:600;}
  input,select{width:100%;padding:7px 9px;border:1px solid #ced4da;border-radius:4px;font-size:13.5px;font-family:inherit;}
  .msg{padding:9px 12px;border-radius:5px;font-size:13px;margin-bottom:9px;display:none;}
  .msg.s{display:block;background:#d4edda;color:#155724;} .msg.e{display:block;background:#f8d7da;color:#721c24;}
  .msg.w{display:block;background:#fff3cd;color:#856404;}
  .info{background:#f8f9fa;border:1px solid #dee2e6;border-radius:5px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.55;}
  .b1{background:#4a90d9;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-size:13.5px;cursor:pointer;font-weight:500;}
  .b2{background:#28a745;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-size:13.5px;cursor:pointer;font-weight:500;}
  .b3{background:#6c757d;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-size:13.5px;cursor:pointer;}
  .b4{background:#dc3545;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-size:13.5px;cursor:pointer;}
  @media print{.agbar,.daybar,.ov,.bt-ag,.bt-d,.bt-g,.bt-r,.bt-n,.ico,.status{display:none!important}}
</style>
<link rel="stylesheet" href="hog-tema.css">
</head>
<body>
<span id="st" class="status ld">conectando…</span>
<div class="agbar" id="agbar"></div>
<div class="daybar">
  <button class="bl" onclick="dia(-1)">Dia anterior</button>
  <input type="date" id="dt" onchange="load()">
  <button class="bl" onclick="dia(1)">Próximo dia</button>
  <button class="bl" style="background:#6c757d" onclick="hoje()">Hoje</button>
  <button class="bl" style="background:#28a745" onclick="novo()">+ Agendar</button>
</div>
<div class="head">
  <span class="badge-med" id="bmed">Selecione uma agenda</span>
  <span class="dt" id="bdata"></span>
  <button class="ico" onclick="window.print()" title="Imprimir">🖨</button>
</div>
<div id="avisos"></div>
<div class="wrap"><div id="ct"></div></div>

<div class="ov" id="ov" onclick="if(event.target===this)fecha()">
  <div class="mdl"><div class="mh"><b id="mt"></b><button onclick="fecha()">✕</button></div>
  <div class="mb" id="mb"></div><div class="mf" id="mf"></div></div>
</div>
<script>
const SB='https://prztrrtwrunljapnyaci.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByenRycnR3cnVubGphcG55YWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzM4NDQsImV4cCI6MjEwMjg0OTg0NH0.oo0_6LTUFDSKgeclJSv5AJ7Ddk8BAzS18sQh4Fr9NLs';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const g=async p=>{const r=await fetch(SB+'/'+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const po=async(t,o)=>{const r=await fetch(SB+'/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text());return r.json()};
const pa=async(t,q,o)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'PATCH',headers:H,body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text())};
const de=async(t,q)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'DELETE',headers:H});if(!r.ok)throw new Error(await r.text())};
const E=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const V=i=>{const e=document.getElementById(i);return e?e.value.trim():''};
const stat=(c,t)=>{const s=document.getElementById('st');s.className='status '+c;s.textContent=t};
const iso=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10)};
const brData=s=>s?String(s).split('-').reverse().join('/'):'';
const hoje=()=>{document.getElementById('dt').value=iso(new Date());load()};
const dia=n=>{const d=new Date(V('dt')+'T12:00:00');d.setDate(d.getDate()+n);document.getElementById('dt').value=iso(d);load()};
const abre=(t,b,f)=>{document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('mf').innerHTML=f;document.getElementById('ov').classList.add('on')};
const fecha=()=>document.getElementById('ov').classList.remove('on');
const sel=(id,arr,v,ph)=>`<select id="${id}"><option value="">${ph||'—'}</option>`+arr.map(o=>`<option value="${o.id}"${o.id===v?' selected':''}>${E(o.nome)}</option>`).join('')+'</select>';
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
let REF={agendas:[],medicos:[],pacientes:[],salas:[]}, AG=[], AGENDA='';
/* perfil de quem está usando — define se pode encaixar (botão vermelho do VoxComm) */
let PERFIL=localStorage.getItem('hog_perfil')||'callcenter';
const PODE_ENCAIXAR=()=>['coordenacao','admin','consultora','centro_cirurgico'].includes(PERFIL);
function trocaPerfil(v){PERFIL=v;localStorage.setItem('hog_perfil',v)}
/* vagas do dia naquela agenda: capacidade do padrão + vagas extras negociadas */
async function vagaDoDia(agid,data){
  const a=REF.agendas.find(x=>x.id===agid); if(!a)return null;
  const [ags,ext]=await Promise.all([
    g(`agendamentos?select=id&agenda_logica_id=eq.${agid}&data=eq.${data}&status=neq.cancelado`).catch(()=>[]),
    g(`vagas_extras?select=quantidade&status=eq.ativa&agenda_logica_id=eq.${agid}&data=eq.${data}`).catch(()=>[])]);
  const extras=ext.reduce((s,x)=>s+(x.quantidade||0),0);
  const vagas=(a.qtd_periodo||0)+extras;
  return {vagas,base:a.qtd_periodo||0,extras,agendados:ags.length,livre:vagas-ags.length,semCapacidade:!a.qtd_periodo};
}

async function loadRef(){
  const [a,m,p,s]=await Promise.all([
    g('agendas_logicas?select=*&order=nome'),g('medicos?select=id,nome&order=nome'),
    g('pacientes?select=id,nome,cpf,nascimento,sobe_escada,telefone&order=nome'),g('salas?select=id,nome&order=nome')]);
  REF={agendas:a,medicos:m,pacientes:p,salas:s};
  renderAgbar();
}

/* ---- Barra de agendas: aparecem SÓ as agendas com movimento no dia (padrão da recepção) ---- */
let DIA_IDS=[], VER_TODAS=(localStorage.getItem('hog_agbar_todas')==='1');
async function carregaAgendasDoDia(){
  const d=V('dt'); if(!d){DIA_IDS=[];return}
  try{
    const r=await g(`agendamentos?select=agenda_logica_id&data=eq.${d}&status=neq.cancelado`);
    DIA_IDS=[...new Set(r.map(x=>x.agenda_logica_id).filter(Boolean))];
  }catch(e){DIA_IDS=[]}
}
function renderAgbar(){
  const lista=VER_TODAS?REF.agendas:REF.agendas.filter(x=>DIA_IDS.includes(x.id));
  let h=`<a class="${AGENDA?'':'on'}" onclick="setAg('')">TODAS</a>`;
  h+=lista.map(x=>`<a class="${AGENDA===x.id?'on':''}" onclick="setAg('${x.id}')">${E(x.nome)}</a>`).join('');
  if(!VER_TODAS&&!lista.length)h+=`<a style="color:#6c757d;cursor:default">— nenhuma agenda com movimento neste dia —</a>`;
  const n=REF.agendas.length-lista.length;
  h+=`<a class="verTodas" onclick="alternaTodas()" title="Agendas sem paciente no dia ficam ocultas">`+
     (VER_TODAS?'&#9776; ver só as do dia':('&#9776; ver todas'+(n>0?' (+'+n+')':'')))+`</a>`;
  document.getElementById('agbar').innerHTML=h;
}
function alternaTodas(){VER_TODAS=!VER_TODAS;localStorage.setItem('hog_agbar_todas',VER_TODAS?'1':'0');renderAgbar()}
function setAg(id){AGENDA=id;renderAgbar();load();}

async function load(){try{
  stat('ld','carregando…');
  if(!V('dt'))document.getElementById('dt').value=iso(new Date());
  const d=V('dt');
  let q=`agendamentos?select=*,pacientes(id,nome,cpf,nascimento,sobe_escada,telefone,convenios(nome)),medicos(nome),salas(nome),agendas_logicas(nome,observacao_agendamento,alerta_ativo)&data=eq.${d}&order=hora`;
  if(AGENDA)q+='&agenda_logica_id=eq.'+AGENDA;
  AG=await g(q);
  await carregaAgendasDoDia();
  if(AGENDA&&!VER_TODAS&&!DIA_IDS.includes(AGENDA))DIA_IDS.push(AGENDA);
  renderAgbar();
  const ag=REF.agendas.find(x=>x.id===AGENDA);
  const med=ag?(REF.medicos.find(m=>m.id===ag.medico_id)||{}).nome:'';
  document.getElementById('bmed').textContent=ag?(med||ag.nome):'Todas as agendas';
  const dd=new Date(d+'T12:00:00');
  document.getElementById('bdata').textContent=`${String(dd.getDate()).padStart(2,'0')}/${String(dd.getMonth()+1).padStart(2,'0')}/${dd.getFullYear()} (${DIAS[dd.getDay()]})`;
  render(ag); stat('ok','● conectado');
}catch(e){document.getElementById('ct').innerHTML='<div class="empty">Erro: '+E(e.message)+'</div>';stat('er','● erro')}}

function render(ag){
  let av='';
  if(ag&&ag.alerta_ativo&&ag.observacao_agendamento)
    av+=`<div class="alerta">🔔 <b>Lembrete da coordenação:</b> ${E(ag.observacao_agendamento)}</div>`;
  const naoSobe=AG.filter(a=>a.pacientes&&a.pacientes.sobe_escada===false).length;
  if(naoSobe)av+=`<div class="alerta">⚠️ <b>${naoSobe} paciente(s) não sobem escada</b> — encaminhar ao térreo; o médico precisará descer.${ag&&ag.cota_nao_sobe_escada?' Cota da agenda: '+ag.cota_nao_sobe_escada+'.':''}</div>`;
  const semCpf=AG.filter(a=>a.pacientes&&!a.pacientes.cpf).length;
  if(semCpf)av+=`<div class="alerta info">🟡 ${semCpf} paciente(s) sem CPF — será obrigatório na entrada.</div>`;
  document.getElementById('avisos').innerHTML=av;

  if(!AG.length){document.getElementById('ct').innerHTML='<div class="empty">Nenhum agendamento nesta data'+(AGENDA?' para esta agenda':'')+'.</div>';return}
  document.getElementById('ct').innerHTML=`<table><thead><tr>
     <th class="num"></th><th></th><th>Horário</th><th>Atendimento</th><th></th>
     <th style="width:45%">Paciente</th><th>Entrada</th><th>Cadastro</th><th>Alterado</th><th></th></tr></thead><tbody>`+
    AG.map((a,i)=>{
      const p=a.pacientes||{};
      const obs=[p.convenios?'('+p.convenios.nome.toUpperCase()+')':'',a.observacao||''].filter(Boolean).join(' ');
      return `<tr>
       <td class="num">${i+1}</td>
       <td><button class="bt-ag" onclick="agendamento('${a.id}')">Agendamento</button></td>
       <td class="hr">${E((a.hora||'').slice(0,5))}</td>
       <td>${E((a.tipo||'').replace('_',' ').toUpperCase())}</td>
       <td><button class="bt-d" onclick="dados('${a.id}')">Dados</button></td>
       <td><div class="pac">${E(p.nome||'—')}</div><div class="sub">${E(obs)}${p.sobe_escada===false?' <span class="tag t-a">NÃO SOBE ESCADA</span>':''}</div></td>
       <td>${entradaCel(a)}</td>
       <td class="who">${E(a.criado_por||'—')}</td>
       <td class="who">${E(a.criado_por&&a.status!=='agendado'?a.criado_por:'')}</td>
       <td style="white-space:nowrap">${acoes(a)}</td></tr>`;
    }).join('')+'</tbody></table>';
}
const entradaCel=a=>({agendado:'<button class="bt-d" onclick="marcar(\''+a.id+'\',\'aguardando\')">Entrada</button>',
  aguardando:'<span class="tag t-a">aguardando</span>',em_atendimento:'<span class="tag t-b">em atend.</span>',
  compareceu:'<span class="tag t-g">finalizado</span>',faltou:'<span class="tag t-r">faltou</span>',
  cancelado:'<span class="tag t-n">cancelado</span>'}[a.status]||E(a.status));
const acoes=a=>a.status==='faltou'?`<button class="bt-n" onclick="reagendar('${a.id}')">↻ reagendar</button>`:
  `<button class="bt-g" onclick="marcar('${a.id}','compareceu')">✓</button>
   <button class="bt-r" onclick="marcar('${a.id}','faltou')">faltou</button>`;
async function marcar(id,s){try{await pa('agendamentos','id=eq.'+id,{status:s});load()}catch(e){alert('Erro: '+e.message)}}

/* ==== Dados do paciente (botão azul) ==== */
async function dados(id){
  const a=AG.find(x=>x.id===id); if(!a)return; const p=a.pacientes||{};
  const [faltas,sol]=await Promise.all([
    g(`agendamentos?paciente_id=eq.${p.id}&status=eq.faltou&select=data&order=data.desc`).catch(()=>[]),
    g(`solicitacoes?paciente_id=eq.${p.id}&status=in.(pendente,entregue)&select=nome_item,lateralidade,status,observacao_proximo_agendamento,medicos(nome)`).catch(()=>[])]);
  const hist=await g(`agendamentos?paciente_id=eq.${p.id}&select=data,hora,tipo,status,observacao,exames(nome),procedimentos(nome),agendas_logicas(nome),medicos(nome)&order=data.desc&limit=12`).catch(()=>[]);
  abre('Dados — '+(p.nome||''),
   `<div class="info">
     <b style="font-size:15px">${E(p.nome||'')}</b><br>
     CPF: ${p.cpf?E(p.cpf):'<span class="tag t-r">pendente</span>'} · Nasc.: ${E(p.nascimento)||'—'} (${idade(p.nascimento)})<br>
     Tel.: ${E(p.telefone)||'—'} · Convênio: ${p.convenios?E(p.convenios.nome):'—'}<br>
     Escada: ${p.sobe_escada===false?'<span class="tag t-a">NÃO SOBE</span>':(p.sobe_escada===null?'<span class="tag t-r">não informado</span>':'sobe normalmente')}
    </div>
    ${faltas.length?`<div class="msg w" style="display:block">${faltas.length>=4?'🔴':'🟠'} <b>${faltas.length} falta(s)</b> — última em ${E(faltas[0].data)}</div>`:''}
    ${sol.length?`<div class="msg" style="display:block;background:#d1ecf1;color:#0c5460">📋 <b>Solicitações do médico</b><br>`+
      sol.map(s=>`• ${E(s.nome_item||'')} ${s.lateralidade?'('+E(s.lateralidade)+')':''} — <b>${E(s.status)}</b>${s.observacao_proximo_agendamento?'<br><i>'+E(s.observacao_proximo_agendamento)+'</i>':''}`).join('<br>')+'</div>':''}
    <div style="font-weight:600;margin:12px 0 5px;font-size:13px">Histórico de agendamentos</div>
    <table style="font-size:13px"><thead><tr><th>Data</th><th>Hora</th><th>Atendimento</th><th>Médico</th><th>Observação</th><th>Status</th></tr></thead><tbody>`+
    (hist.length?hist.map(h=>{
      const c = h.status==='faltou'    ? 'background:#f8d7da;color:#58151c'
              : h.status==='cancelado' ? 'background:#e9ecef;color:#6c757d;text-decoration:line-through'
              : ['compareceu','realizado'].includes(h.status) ? 'background:#d1e7dd;color:#0a3622' : '';
      const at=(h.exames&&h.exames.nome)||(h.procedimentos&&h.procedimentos.nome)||(h.agendas_logicas&&h.agendas_logicas.nome)||h.tipo||'—';
      const dd=new Date(h.data+'T12:00:00');
      return `<tr style="${c}"><td>${DIAS[dd.getDay()].slice(0,3)} ${E(brData(h.data))}</td><td>${E((h.hora||'').slice(0,5))}</td>
      <td>${E(at)}</td><td>${h.medicos?E(h.medicos.nome):'—'}</td>
      <td style="font-size:12px">${E(h.observacao||'')}</td><td>${stTag(h.status)}</td></tr>`}).join('')
      :'<tr><td colspan="6">Sem histórico</td></tr>')+
    '</tbody></table>',
   `<button class="b3" onclick="fecha()">Fechar</button>`);
}

/* O que este paciente está esperando — aparece antes de qualquer coisa,
   para o call center não precisar abrir cadastro nem prontuário. */
async function pendencias(){
  const box=document.getElementById('n_pend'); if(!box)return;
  const pid=V('n_pac'); box.innerHTML=''; PEND=[];
  if(!pid)return;
  const p=REF.pacientes.find(x=>x.id===pid);
  try{ PEND=await g(`vw_pendencias_paciente?paciente_id=eq.${pid}`) }
  catch(e){
    try{ const s=await g(`solicitacoes?paciente_id=eq.${pid}&status=in.(pendente,entregue)&select=*,exames(nome),procedimentos(nome),medicos(nome),convenios(nome)`);
      PEND=s.map(x=>({solicitacao_id:x.id,item:(x.exames&&x.exames.nome)||(x.procedimentos&&x.procedimentos.nome)||x.nome_item,
        natureza:x.exame_id?'exame':(x.procedimento_id?'procedimento':'retorno'),lateralidade:x.lateralidade,
        medico_solicitante:x.medicos?x.medicos.nome:'',convenio:x.convenios?x.convenios.nome:'',
        numero_requisicao:x.numero_requisicao,requisicao_validade:x.requisicao_validade,
        exige_autorizacao:x.exige_autorizacao,autorizacao_status:x.autorizacao_status,
        observacao_proximo_agendamento:x.observacao_proximo_agendamento,
        pode_agendar:!!x.numero_requisicao||!x.exame_id,
        impedimento:x.numero_requisicao?'liberada para agendar':'falta o número da requisição'})) }catch(_){ PEND=[] }
  }
  let h='';
  /* falar com o paciente no WhatsApp direto do agendamento */
  const tel=digits(p&&(p.whatsapp||p.telefone||p.telefone_responsavel)||'');
  let btnDg='';
  try{
    const lig=await g(`contato_paciente?select=contatos(digisac_contact_id)&paciente_id=eq.${pid}`);
    const cid=lig.map(x=>x.contatos&&x.contatos.digisac_contact_id).filter(Boolean)[0];
    if(cid) btnDg=`<button class="b1" style="background:#2c4a80;color:#fff" onclick="abreDigisac('${cid}')">🗨 Abrir DIGISAC</button>`;
  }catch(e){}
  if(tel||btnDg) h+=`<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${tel?`<button class="b1" style="background:#25D366;color:#fff" onclick="zap('${tel}','${E((p.nome||'').split(' ')[0])}')">💬 WhatsApp</button>`:''}
      ${btnDg}
      ${tel?`<span class="hint" style="font-size:12px;color:#6c757d">${fmtTelBr(tel)}</span>`:''}</div>`;
  if(PEND.length){
    h+=`<div style="background:#e7f1ff;border:1px solid #b6d4fe;border-radius:6px;padding:8px 10px;margin-bottom:9px">
      <div style="font-weight:700;font-size:13px;color:#052c65;margin-bottom:5px">
        📋 ${PEND.length} pendência(s) deste paciente — pedido pelo médico, ainda sem agendar</div>`;
    h+=PEND.map(x=>{
      const ok=x.pode_agendar, venc=x.requisicao_validade;
      const dias=venc?Math.round((new Date(venc+'T12:00:00')-new Date())/864e5):null;
      const cor=ok?(dias!=null&&dias<=7?'#fff3cd':'#d1e7dd'):'#f8d7da';
      const txt=ok?(dias!=null&&dias<=7?'#664d03':'#0a3622'):'#58151c';
      return `<div style="background:${cor};color:${txt};border-radius:4px;padding:6px 8px;margin-top:5px;font-size:13px">
        <b>${E(x.item||'—')}</b>${x.lateralidade?' ('+E(x.lateralidade)+')':''}
        <span style="opacity:.8">· ${E(x.natureza||'')}</span>
        ${x.medico_solicitante?'<span style="opacity:.8">· pedido por '+E(x.medico_solicitante)+'</span>':''}
        <br>${x.numero_requisicao?'Requisição <b>'+E(x.numero_requisicao)+'</b>':'<b>sem número de requisição</b>'}
        ${venc?' · validade '+E(brData(venc))+(dias!=null?` (${dias<0?'VENCIDA':dias+' dia(s)'})`:''):''}
        ${x.exige_autorizacao?' · autorização: <b>'+E(x.autorizacao_status||'pendente')+'</b>':''}
        ${x.convenio?' · '+E(x.convenio):''}
        ${x.observacao_proximo_agendamento?'<br><i>💬 '+E(x.observacao_proximo_agendamento)+'</i>':''}
        <br><b>${ok?'✓ liberada para agendar':'⛔ '+E(x.impedimento||'')}</b>
        ${ok?`<button class="b1" style="padding:.1rem .5rem;font-size:12px;margin-left:6px" onclick="usarPendencia('${x.solicitacao_id}')">usar esta</button>`
            :`<button class="b1" style="padding:.1rem .5rem;font-size:12px;margin-left:6px;background:#fd7e14" onclick="resolverPendencia('${x.solicitacao_id}')">resolver</button>`}
      </div>`}).join('');
    h+='</div>';
  }else{
    h+=`<div style="background:#f8f9fa;border:1px solid #dee2e6;border-radius:6px;padding:7px 10px;margin-bottom:9px;font-size:13px;color:#6c757d">
      Nenhum exame ou procedimento pedido pelo médico aguardando agendamento.</div>`;
  }
  box.innerHTML=h;
}
function usarPendencia(id){
  const x=PEND.find(p=>String(p.solicitacao_id)===String(id)); if(!x)return;
  SOL_ATUAL=x;
  document.getElementById('n_obs').value=(x.item||'')+(x.numero_requisicao?' · req '+x.numero_requisicao:'');
  const m=document.getElementById('n_msg'); m.className='msg s';
  m.innerHTML=`Agendando <b>${E(x.item)}</b> com a requisição <b>${E(x.numero_requisicao||'—')}</b>.`;
}
async function resolverPendencia(id){
  const x=PEND.find(p=>String(p.solicitacao_id)===String(id)); if(!x)return;
  const falta=(x.impedimento||'');
  let o={};
  if(falta.includes('requisição vencida')){ alert('Requisição vencida — o médico precisa emitir outra.'); return }
  if(falta.includes('número')){
    const n=prompt('Número da requisição (guia):'); if(!n)return;
    const v=prompt('Validade da requisição (aaaa-mm-dd):','');
    o.numero_requisicao=n; if(v)o.requisicao_validade=v;
  }
  if(falta.includes('autorização')){
    const s=prompt('Senha / número da autorização do convênio:'); if(!s)return;
    const v=prompt('Validade da autorização (aaaa-mm-dd):','');
    o.autorizacao_senha=s; o.autorizacao_status='autorizada'; o.autorizacao_em=new Date().toISOString();
    o.autorizacao_por=V('n_quem')||PERFIL; if(v)o.autorizacao_validade=v;
  }
  try{ await pa('solicitacoes','id=eq.'+id,o); await pendencias() }
  catch(e){ alert('Erro: '+e.message+'\n(precisa do hog-requisicoes.sql)') }
}

/* o botão define o CRITÉRIO: horário padrão da agenda x horário criado por um motivo */
function modo(v){
  if(v==='criado'&&!PODE_ENCAIXAR()){
    alert('Criar horário é encaixe — seu perfil não tem essa autorização.\n\nUse o horário padrão ou coloque o paciente na lista de espera.');
    return;
  }
  MODO_AG=v;
  document.querySelectorAll('#ch_modo .chipm').forEach(c=>c.classList.toggle('on',c.dataset.v===v));
  document.getElementById('bx_motivo').style.display = v==='criado'?'block':'none';
  document.getElementById('modo_hint').innerHTML = v==='criado'
    ? '<b style="color:#b02a37">Horário fora da grade</b> — entra como <b>encaixe</b>, com motivo e responsável, e conta no indicador de encaixes.'
    : 'Usa uma vaga que já existe na agenda.';
  const b=document.getElementById('btn_ok');
  if(b){b.textContent = v==='criado'?'Criar horário e agendar':'Agendar';
        b.style.background = v==='criado'?'#dc3545':''}
  checar();
}
async function paraEspera(){
  const pid=V('n_pac'),agid=V('n_ag');
  if(!pid||!agid)return alert('Escolha paciente e agenda.');
  const ag=REF.agendas.find(x=>x.id===agid);
  const urg=confirm('Marcar como URGENTE na lista de espera?\n\nOK = urgente · Cancelar = normal');
  try{
    await po('lista_espera',[{paciente_id:pid,agenda_logica_id:agid,medico_id:ag?ag.medico_id:null,
      tipo:V('n_tipo')||'consulta',prioridade:urg?'urgente':'normal',
      observacao:V('n_obs')||'entrou na espera porque a agenda estava lotada',status:'aguardando'}]);
    fecha(); alert('✅ Paciente na lista de espera. Quando a coordenação liberar vagas, o call center é avisado.');
  }catch(e){ alert('Erro: '+e.message+'\n(a lista de espera precisa do hog-grade.sql)') }
}
async function checar(){
  const box=document.getElementById('n_alertas');box.innerHTML='';TRAVA=null;SEM_VAGA=false;
  const pid=V('n_pac'),agid=V('n_ag'),data=V('n_data'); if(!pid)return;
  const p=REF.pacientes.find(x=>x.id===pid), ag=REF.agendas.find(x=>x.id===agid); let al=[];
  /* ---- vaga na agenda: é o que separa agendar de encaixar ---- */
  if(agid&&data){
    const v=await vagaDoDia(agid,data);
    if(v&&!v.semCapacidade){
      if(v.livre>0){
        al.push(`<div class="msg s" style="display:block">🟢 <b>${v.livre} vaga(s) livre(s)</b> — ${v.agendados} de ${v.vagas}${v.extras?` (inclui +${v.extras} extras negociadas)`:''}.</div>`);
      }else{
        SEM_VAGA=true;
        al.push(PODE_ENCAIXAR()
          ? `<div class="msg w" style="display:block">🟠 <b>Agenda lotada</b> (${v.agendados}/${v.vagas}). Seu perfil pode <b>encaixar</b> — será registrado como encaixe, com motivo e autorização.</div>`
          : `<div class="msg e" style="display:block">🔴 <b>Agenda lotada</b> (${v.agendados}/${v.vagas}). Seu perfil não pode encaixar — coloque o paciente na <b>lista de espera</b>; quando a coordenação liberar mais vagas, o call center é avisado.</div>`);
      }
    }
  }
  try{
    const d=new Date(data+'T12:00:00'),a1=new Date(d),a2=new Date(d);a1.setDate(a1.getDate()-30);a2.setDate(a2.getDate()+30);
    const perto=await g(`agendamentos?paciente_id=eq.${pid}&tipo=in.(consulta,retorno)&status=in.(agendado,aguardando,em_atendimento,compareceu)&data=gte.${iso(a1)}&data=lte.${iso(a2)}&select=data`);
    if(perto.length){TRAVA='intervalo';al.push(`<div class="msg e" style="display:block">🔴 <b>Consulta em menos de 30 dias</b> — já existe em ${perto.map(x=>E(x.data)).join(', ')}. Requer aprovação.</div>`)}
    const faltas=await g(`agendamentos?paciente_id=eq.${pid}&status=eq.faltou&select=data&order=data.desc`);
    if(faltas.length)al.push(`<div class="msg w" style="display:block">${faltas.length>=4?'🔴':'🟠'} <b>${faltas.length} falta(s)</b> — última em ${E(faltas[0].data)}. Reforçar confirmação.</div>`);
    if(p&&p.sobe_escada===false&&ag&&ag.cota_nao_sobe_escada){
      const ms=await g(`agendamentos?agenda_logica_id=eq.${agid}&data=eq.${data}&status=in.(agendado,aguardando,compareceu)&select=pacientes(sobe_escada)`);
      const n=ms.filter(x=>x.pacientes&&x.pacientes.sobe_escada===false).length;
      if(n>=ag.cota_nao_sobe_escada){TRAVA='cota';al.push(`<div class="msg e" style="display:block">🔴 <b>Cota esgotada</b> — máx. ${ag.cota_nao_sobe_escada} que não sobem escada; já há ${n}.</div>`)}
      else al.push(`<div class="msg w" style="display:block">🟠 Não sobe escada — ${n+1}/${ag.cota_nao_sobe_escada} da cota. Encaminhar ao térreo.</div>`);
    }
    if(p&&ag&&ag.idade_min&&p.nascimento){const i=parseInt(idade(p.nascimento));
      if(i<ag.idade_min)al.push(`<div class="msg w" style="display:block">🟠 Idade ${i} abaixo do mínimo (${ag.idade_min}).</div>`)}
    if(ag&&ag.alerta_ativo&&ag.observacao_agendamento)al.push(`<div class="alerta" style="margin:0 0 9px">🔔 <b>Lembrete:</b> ${E(ag.observacao_agendamento)}</div>`);
    const sol=await g(`solicitacoes?paciente_id=eq.${pid}&status=in.(pendente,entregue)&select=nome_item,lateralidade,observacao_proximo_agendamento,retorno_prazo_dias`).catch(()=>[]);
    if(sol.length)al.push(`<div class="msg" style="display:block;background:#d1ecf1;color:#0c5460">📋 <b>Orientação do médico</b><br>`+
      sol.map(s=>`• ${E(s.nome_item||'')} ${s.lateralidade?'('+E(s.lateralidade)+')':''}${s.observacao_proximo_agendamento?' — <i>'+E(s.observacao_proximo_agendamento)+'</i>':''}${s.retorno_prazo_dias?' · retorno '+s.retorno_prazo_dias+'d':''}`).join('<br>')+'</div>');
    if(p&&!p.cpf)al.push(`<div class="msg w" style="display:block">🟡 Sem CPF (pré-cadastro) — obrigatório na entrada.</div>`);
  }catch(e){al.push('<div class="msg e" style="display:block">Erro: '+E(e.message)+'</div>')}
  box.innerHTML=al.join('');
  const b=document.getElementById('btn_ok');
  if(TRAVA){b.textContent='⚠ Agendar com aprovação';b.className='b4';b.onclick=()=>salvar(true)}
  else{b.textContent='Agendar';b.className='b2';b.onclick=()=>salvar(false)}
}
async function salvar(comAprov){
  const m=document.getElementById('n_msg');
  if(!V('n_pac')||!V('n_ag')||!V('n_data')||!V('n_hora')){m.className='msg e';m.textContent='Preencha paciente, agenda, data e hora.';return}
  let ap={};
  if(comAprov){const q=prompt('Aprovação necessária.\nQuem aprova?');if(!q)return;
    ap={aprovacao_intervalo_por:q,aprovacao_intervalo_motivo:prompt('Motivo:')||''}}
  /* ---- critério: horário criado = encaixe, com motivo obrigatório ---- */
  if(MODO_AG==='criado'){
    if(!PODE_ENCAIXAR()){m.className='msg e';m.textContent='Seu perfil não pode criar horário.';return}
    if(!V('n_motivo')){m.className='msg e';m.innerHTML='Informe o <b>motivo de criar o horário</b>.';return}
    ap.encaixe=true; ap.encaixe_motivo=V('n_motivo');
    ap.encaixe_por=V('n_quem')||PERFIL; ap.encaixe_autorizado_por=V('n_quem')||PERFIL;
  }
  /* ---- horário padrão com a agenda lotada: não força; oferece a espera ---- */
  else if(SEM_VAGA){
    m.className='msg e';
    m.innerHTML=PODE_ENCAIXAR()
      ? '🔴 Não há vaga no horário padrão. Para colocar assim mesmo, escolha <b>🔴 Criar horário (encaixe)</b> acima.'
      : '🔴 Agenda lotada e seu perfil não pode criar horário. Use <b>“Lista de espera”</b> abaixo.';
    const pf=document.getElementById('mf');
    if(pf&&!document.getElementById('btn_esp'))
      pf.insertAdjacentHTML('beforeend','<button class="b1" id="btn_esp" style="background:#fd7e14" onclick="paraEspera()">📋 Lista de espera</button>');
    return;
  }
  try{const ag=REF.agendas.find(x=>x.id===V('n_ag'));
    const base={paciente_id:V('n_pac'),agenda_logica_id:V('n_ag'),medico_id:ag?ag.medico_id:null,
      sala_id:V('n_sala')||null,tipo:V('n_tipo'),data:V('n_data'),hora:V('n_hora'),status:'agendado',
      observacao:V('n_obs')||null,criado_por:V('n_quem')||null,...ap};
    if(SOL_ATUAL){ base.solicitacao_id=SOL_ATUAL.solicitacao_id;
      base.numero_requisicao=SOL_ATUAL.numero_requisicao||null;
      base.autorizacao_senha=SOL_ATUAL.autorizacao_senha||null;
      base.exame_id=SOL_ATUAL.exame_id||null; }
    try{ await po('agendamentos',base) }
    catch(err){ /* banco ainda sem as colunas de encaixe */
      const {encaixe,encaixe_motivo,encaixe_por,encaixe_autorizado_por,...limpo}=base;
      limpo.observacao=(limpo.observacao?limpo.observacao+' · ':'')+(encaixe?('ENCAIXE: '+(encaixe_motivo||'')+' — autorizado por '+(encaixe_autorizado_por||'')):'');
      await po('agendamentos',limpo);
    }
    if(SOL_ATUAL){ try{ await pa('solicitacoes','id=eq.'+SOL_ATUAL.solicitacao_id,
      {status:'agendado',agendado_por:V('n_quem')||PERFIL,agendado_em:new Date().toISOString()}) }catch(_){} }
    SOL_ATUAL=null;
    fecha();load()}catch(e){m.className='msg e';m.innerHTML='Erro: '+E(e.message)}
}
async function reagendar(id){
  const a=AG.find(x=>x.id===id);if(!a)return;
  const f=await g(`agendamentos?paciente_id=eq.${a.paciente_id}&status=eq.faltou&select=data`).catch(()=>[]);
  abre('Reagendar por falta',
   `<div class="info"><b>${E(a.pacientes?a.pacientes.nome:'')}</b> faltou em ${E(a.data)}.</div>
    ${f.length>=2?`<div class="msg w" style="display:block">🟠 <b>${f.length} faltas</b> no histórico.</div>`:''}
    <div class="grid"><div><label>Nova data</label><input type="date" id="rg_d" value="${V('dt')}"></div>
    <div><label>Nova hora</label><input type="time" id="rg_h" value="${(a.hora||'08:00').slice(0,5)}"></div></div>`,
   `<button class="b3" onclick="fecha()">Cancelar</button><button class="b2" onclick="salvarReag('${id}')">↻ Reagendar</button>`);
}
async function salvarReag(id){const a=AG.find(x=>x.id===id);
  try{await po('agendamentos',{paciente_id:a.paciente_id,agenda_logica_id:a.agenda_logica_id,medico_id:a.medico_id,
    sala_id:a.sala_id,tipo:a.tipo,data:V('rg_d'),hora:V('rg_h'),status:'agendado',reagendamento_de:id,motivo_reagendamento:'falta'});
  fecha();load()}catch(e){alert('Erro: '+e.message)}}
(async()=>{document.getElementById('dt').value=iso(new Date());await loadRef();load()})();
</script>
