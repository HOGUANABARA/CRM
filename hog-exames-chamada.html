<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOG Gestão — Chamada de Exames</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#212529;font-size:16px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .daybar{background:#dce9f7;padding:9px;display:flex;justify-content:center;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .bl{background:#0d6efd;color:#fff;border:none;padding:.375rem .75rem;border-radius:.375rem;font-size:16px;cursor:pointer;}
  .status{position:absolute;right:12px;top:8px;font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;z-index:5;}
  .ok{background:#d1e7dd;color:#0a3622;} .er{background:#f8d7da;color:#58151c;} .ld{background:#fff3cd;color:#664d03;}
  .head{display:flex;justify-content:center;align-items:center;gap:12px;padding:9px;flex-wrap:wrap;flex-shrink:0;}
  .titulo{background:#dc3545;color:#fff;padding:.4rem .9rem;border-radius:.375rem;font-size:15px;}
  .data{font-size:16px;font-weight:600;}
  .kpis{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px 8px;flex-shrink:0;}
  .k{background:#f8f9fa;border:1px solid #dee2e6;border-radius:.375rem;padding:.45rem .9rem;text-align:center;min-width:100px;}
  .k .n{font-size:19px;font-weight:700;} .k .l{font-size:10px;color:#6c757d;text-transform:uppercase;}
  .k.al{background:#fff3cd;border-color:#ffc107;} .k.al .n{color:#664d03;}
  .cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 12px 12px;overflow:hidden;}
  @media(max-width:900px){.cols{grid-template-columns:1fr;overflow:auto;}}
  .col{background:#f8f9fa;border:1px solid #dee2e6;border-radius:.375rem;display:flex;flex-direction:column;overflow:hidden;}
  .col h2{font-size:13px;padding:9px 12px;border-bottom:1px solid #dee2e6;background:#fff;display:flex;align-items:center;gap:8px;}
  .col h2 .c{margin-left:auto;background:#e9ecef;color:#495057;border-radius:9px;font-size:12px;padding:0 8px;}
  .col.aguard h2{border-bottom-color:#ffc107;} .col.aguard h2 .c{background:#fff3cd;color:#664d03;}
  .col.exec h2{border-bottom-color:#0d6efd;} .col.exec h2 .c{background:#cfe2ff;color:#052c65;}
  .col.feito h2{border-bottom-color:#198754;} .col.feito h2 .c{background:#d1e7dd;color:#0a3622;}
  .lista{flex:1;overflow-y:auto;padding:8px;}
  .card{background:#fff;border:1px solid #dee2e6;border-radius:.375rem;padding:10px 12px;margin-bottom:8px;}
  .card.chamado{border-color:#ffc107;background:#fffdf5;box-shadow:0 0 0 2px rgba(255,193,7,.25);}
  .card .nome{font-weight:700;text-transform:uppercase;font-size:15px;line-height:1.25;}
  .card .meta{font-size:13px;color:#495057;margin-top:2px;}
  .card .ex{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}
  .card .acoes{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{display:inline-block;padding:.2rem .55rem;border-radius:.375rem;font-size:12px;font-weight:600;}
  .t-b{background:#cfe2ff;color:#052c65;} .t-a{background:#fff3cd;color:#664d03;} .t-g{background:#d1e7dd;color:#0a3622;}
  .t-r{background:#f8d7da;color:#58151c;} .t-n{background:#e9ecef;color:#495057;} .t-teal{background:#cff4fc;color:#055160;}
  .b{border:none;border-radius:.25rem;font-size:14px;padding:.25rem .6rem;cursor:pointer;font-weight:500;}
  .b-call{background:#ffc107;color:#000;} .b-go{background:#0d6efd;color:#fff;}
  .b-ok{background:#198754;color:#fff;} .b-no{background:#dc3545;color:#fff;} .b-n{background:#e9ecef;color:#495057;}
  .senha{background:#212529;color:#fff;border-radius:.25rem;padding:.1rem .5rem;font-size:13px;font-weight:700;letter-spacing:.5px;}
  .vazio{padding:24px;text-align:center;color:#adb5bd;font-style:italic;font-size:14px;}
  .prep{background:#fff3cd;border:1px solid #ffe69c;border-radius:.25rem;padding:5px 8px;font-size:12.5px;color:#664d03;margin-top:6px;}
  .painel{position:fixed;inset:0;background:#0b1c2c;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:90;}
  .painel.on{display:flex;}
  .painel .lbl{font-size:20px;color:#7FA8C4;text-transform:uppercase;letter-spacing:3px;}
  .painel .nm{font-size:58px;font-weight:700;margin:14px 0;text-align:center;padding:0 30px;text-transform:uppercase;}
  .painel .sl{font-size:30px;color:#1B9CE0;}
  .painel button{margin-top:34px;background:#fff;color:#0b1c2c;border:none;border-radius:.375rem;padding:.6rem 1.4rem;font-size:16px;cursor:pointer;}
  .posto{background:#fff;border-bottom:1px solid #dee2e6;padding:8px 14px;display:flex;align-items:center;
    gap:9px;flex-wrap:wrap;flex-shrink:0;font-size:14px;}
  .posto b{font-size:14px;} .posto select{max-width:260px;} .posto input{max-width:200px;}
</style>
<link rel="stylesheet" href="hog-tema.css">
</head>
<body>
<span id="st" class="status ld">conectando…</span>
<div class="daybar">
  <button class="bl" onclick="dia(-1)">Dia anterior</button>
  <input type="date" id="dt" onchange="load()">
  <button class="bl" onclick="dia(1)">Próximo dia</button>
  <button class="bl" style="background:#6c757d" onclick="hoje()">Hoje</button>
  <button class="bl" style="background:#198754" onclick="load()">↻ Atualizar</button>
</div>
<div class="posto" id="posto">
  <b>📍 Estação logada:</b>
  <select id="sala_logada" onchange="salvarPosto()"><option value="">— selecione a sala —</option></select>
  <input id="tecnico" placeholder="quem está atendendo" onchange="salvarPosto()">
  <span id="posto_ok" class="tag t-g" style="display:none">✓ painel de senhas direcionando para esta sala</span>
  <span id="posto_no" class="tag t-r">⚠ selecione a sala para poder chamar</span>
</div>
<div class="head"><span class="titulo">Chamada de Exames</span><span class="data" id="bdata"></span></div>
<div class="kpis" id="kpis"></div>
<div class="cols">
  <div class="col aguard"><h2>⏳ Aguardando chamada <span class="c" id="c1">0</span></h2><div class="lista" id="l1"></div></div>
  <div class="col exec"><h2>🔬 Em execução <span class="c" id="c2">0</span></h2><div class="lista" id="l2"></div></div>
  <div class="col feito"><h2>✅ Concluídos <span class="c" id="c3">0</span></h2><div class="lista" id="l3"></div></div>
</div>
<div class="painel" id="painel" onclick="fecharPainel()">
  <div class="lbl">Chamando</div>
  <div class="nm" id="p_nome"></div>
  <div class="sl" id="p_sala"></div>
  <button onclick="fecharPainel()">Fechar</button>
</div>
<script>
const SB='https://prztrrtwrunljapnyaci.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByenRycnR3cnVubGphcG55YWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzM4NDQsImV4cCI6MjEwMjg0OTg0NH0.oo0_6LTUFDSKgeclJSv5AJ7Ddk8BAzS18sQh4Fr9NLs';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const g=async p=>{const r=await fetch(SB+'/'+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const pa=async(t,q,o)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'PATCH',headers:H,body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text())};
const E=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const V=i=>{const e=document.getElementById(i);return e?e.value.trim():''};
const stat=(c,t)=>{const s=document.getElementById('st');s.className='status '+c;s.textContent=t};
const iso=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10)};
const hoje=()=>{document.getElementById('dt').value=iso(new Date());load()};
const dia=n=>{const d=new Date(V('dt')+'T12:00:00');d.setDate(d.getDate()+n);document.getElementById('dt').value=iso(d);load()};
const H2=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
let AG=[], EX={};

async function loadRef(){
  const ex=await g('exames?select=id,nome,sigla,preparo,dilata').catch(()=>[]);
  ex.forEach(e=>EX[e.id]=e);
}
async function load(){try{
  stat('ld','carregando…');
  if(!V('dt'))document.getElementById('dt').value=iso(new Date());
  const d=V('dt');
  AG=await g(`exame_agendamentos?select=*,pacientes(nome,cpf,telefone,sobe_escada,convenios(nome))&data=eq.${d}&order=ini`);
  const dd=new Date(d+'T12:00:00');
  document.getElementById('bdata').textContent=`${String(dd.getDate()).padStart(2,'0')}/${String(dd.getMonth()+1).padStart(2,'0')}/${dd.getFullYear()} (${DIAS[dd.getDay()]})`;
  render(); stat('ok','● conectado');
}catch(e){document.getElementById('l1').innerHTML='<div class="vazio">Erro: '+E(e.message)+'</div>';stat('er','● erro')}}

function render(){
  const st=a=>a.status||'agendado';
  const aguard=AG.filter(a=>['agendado','chamado'].includes(st(a)));
  const exec=AG.filter(a=>st(a)==='em_execucao');
  const feito=AG.filter(a=>['realizado','faltou'].includes(st(a)));
  document.getElementById('c1').textContent=aguard.length;
  document.getElementById('c2').textContent=exec.length;
  document.getElementById('c3').textContent=feito.length;
  const cham=aguard.filter(a=>st(a)==='chamado').length;
  const faltas=feito.filter(a=>st(a)==='faltou').length;
  document.getElementById('kpis').innerHTML=
    k(AG.length,'Agendados no dia')+(cham?kA(cham,'Chamados sem atender'):k(0,'Chamados'))+
    k(exec.length,'Em execução')+k(feito.filter(a=>st(a)==='realizado').length,'Realizados')+
    (faltas?kA(faltas,'Faltaram'):k(0,'Faltaram'));
  document.getElementById('l1').innerHTML=aguard.length?aguard.map(card1).join(''):'<div class="vazio">Ninguém aguardando.</div>';
  document.getElementById('l2').innerHTML=exec.length?exec.map(card2).join(''):'<div class="vazio">Nenhum exame em execução.</div>';
  document.getElementById('l3').innerHTML=feito.length?feito.map(card3).join(''):'<div class="vazio">Nada concluído ainda.</div>';
}
const k=(n,l)=>`<div class="k"><div class="n">${n}</div><div class="l">${l}</div></div>`;
const kA=(n,l)=>`<div class="k al"><div class="n">${n}</div><div class="l">⚠ ${l}</div></div>`;
const exTags=a=>(a.exames||[]).map(x=>`<span class="tag t-teal">${E(EX[x]?EX[x].sigla||EX[x].nome:x)}</span>`).join('');
const preparos=a=>{const p=[...new Set((a.exames||[]).map(x=>EX[x]&&EX[x].preparo).filter(Boolean))];
  return p.length?`<div class="prep">⚠️ ${p.map(E).join(' · ')}</div>`:''};
const dilata=a=>(a.exames||[]).some(x=>EX[x]&&EX[x].dilata)?'<span class="tag t-a">dilata</span>':'';
const info=a=>{const p=a.pacientes||{};
  return `<div class="nome">${E(a.paciente_nome||p.nome||'—')}</div>
   <div class="meta">${H2(a.ini)}–${H2(a.fim)} · ${E(a.sala||'sala?')}${a.chegar_as?' · chegar '+E(a.chegar_as):''}
   ${p.convenios?' · '+E(p.convenios.nome):''}${p.sobe_escada===false?' · <span class="tag t-a">não sobe escada</span>':''}</div>
   <div class="ex">${exTags(a)}${dilata(a)}</div>${preparos(a)}`};

const card1=a=>`<div class="card ${a.status==='chamado'?'chamado':''}">
  ${info(a)}
  ${a.status==='chamado'?'<div class="meta" style="margin-top:6px"><span class="senha">CHAMADO</span> aguardando o paciente…</div>':''}
  <div class="acoes">
    ${a.status==='chamado'
      ? `<button class="b b-go" onclick="mudar('${a.id}','em_execucao')">▶ Iniciar exame</button>
         <button class="b b-call" onclick="chamar('${a.id}')">🔔 Chamar de novo</button>
         <button class="b b-no" onclick="mudar('${a.id}','faltou')">Faltou</button>`
      : `<button class="b b-call" onclick="chamar('${a.id}')">🔔 Chamar</button>
         <button class="b b-go" onclick="mudar('${a.id}','em_execucao')">▶ Iniciar</button>
         <button class="b b-no" onclick="mudar('${a.id}','faltou')">Faltou</button>`}
  </div></div>`;
const card2=a=>`<div class="card">${info(a)}
  <div class="acoes">
    <button class="b b-ok" onclick="mudar('${a.id}','realizado')">✓ Concluir exame</button>
    <button class="b b-n" onclick="mudar('${a.id}','chamado')">↩ voltar p/ fila</button>
  </div></div>`;
const card3=a=>`<div class="card" style="opacity:.85">${info(a)}
  <div class="acoes"><span class="tag ${a.status==='realizado'?'t-g':'t-r'}">${a.status==='realizado'?'realizado':'faltou'}</span>
   <button class="b b-n" onclick="mudar('${a.id}','agendado')">↩ desfazer</button></div></div>`;

/* ===== Estação logada — o painel de senhas precisa saber a SALA ===== */
async function carregaSalas(){
  const s=await g('salas?select=id,nome&order=nome').catch(()=>[]);
  const el=document.getElementById('sala_logada');
  el.innerHTML='<option value="">— selecione a sala —</option>'+
    s.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`).join('');
  const sv=localStorage.getItem('hog_sala_exame')||'';
  const tc=localStorage.getItem('hog_tecnico')||'';
  if(sv)el.value=sv; if(tc)document.getElementById('tecnico').value=tc;
  marcaPosto();
}
function salvarPosto(){
  localStorage.setItem('hog_sala_exame',V('sala_logada'));
  localStorage.setItem('hog_tecnico',V('tecnico'));
  marcaPosto();
}
function marcaPosto(){
  const ok=!!V('sala_logada');
  document.getElementById('posto_ok').style.display=ok?'':'none';
  document.getElementById('posto_no').style.display=ok?'none':'';
  document.getElementById('posto').style.background=ok?'#fff':'#fff8e6';
}
const salaLogadaNome=()=>{const e=document.getElementById('sala_logada');
  return e && e.selectedIndex>0 ? e.options[e.selectedIndex].text : ''};

async function chamar(id){
  const a=AG.find(x=>x.id===id); if(!a)return;
  const sala=salaLogadaNome();
  if(!sala){alert('⚠️ Selecione a SALA em que esta agenda está logada.\n\nO painel de senhas precisa saber para onde direcionar o paciente.');
    document.getElementById('sala_logada').focus();return}
  const nome=a.paciente_nome||(a.pacientes?a.pacientes.nome:'');
  try{ await pa('exame_agendamentos','id=eq.'+id,
    {status:'chamado',sala_chamada:sala,chamado_por:V('tecnico')||null,chamado_em:new Date().toISOString()}); }
  catch(e){ try{ await pa('exame_agendamentos','id=eq.'+id,{status:'chamado'}); }catch(_){} }
  /* envia ao painel de senhas (NextQS) — integração */
  document.getElementById('p_nome').textContent=nome;
  document.getElementById('p_sala').textContent='→ '+sala;
  document.getElementById('painel').classList.add('on');
  setTimeout(fecharPainel,6000);
  load();
}
function fecharPainel(){document.getElementById('painel').classList.remove('on')}
async function mudar(id,s){try{await pa('exame_agendamentos','id=eq.'+id,{status:s});load()}catch(e){alert('Erro: '+e.message)}}
(async()=>{document.getElementById("dt").value=iso(new Date());await loadRef();await carregaSalas();load();setInterval(load,60000)})();
</script>
</body>
</html>
