<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOG Gestão — Painel do Contato (DIGISAC)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#212529;font-size:15px;}
  .top{background:#0d6efd;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .top b{font-size:15px;} .top .tel{margin-left:auto;font-size:13px;opacity:.9;}
  .wrap{padding:11px 12px 40px;}
  .card{border:1px solid #dee2e6;border-radius:.375rem;padding:10px 11px;margin-bottom:10px;}
  .card h3{font-size:13px;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .pac{font-weight:700;text-transform:uppercase;font-size:16px;line-height:1.2;}
  .sub{font-size:13px;color:#495057;margin-top:2px;}
  .tag{display:inline-block;padding:.15rem .5rem;border-radius:.375rem;font-size:11.5px;font-weight:600;}
  .t-b{background:#cfe2ff;color:#052c65;} .t-g{background:#d1e7dd;color:#0a3622;}
  .t-a{background:#fff3cd;color:#664d03;} .t-r{background:#f8d7da;color:#58151c;} .t-n{background:#e9ecef;color:#495057;}
  .b{border:none;border-radius:.375rem;font-size:14px;padding:.4rem .8rem;cursor:pointer;font-weight:500;}
  .b-p{background:#0d6efd;color:#fff;} .b-g{background:#198754;color:#fff;} .b-n{background:#e9ecef;color:#495057;}
  .b-w{background:#fd7e14;color:#fff;} .b-s{padding:.2rem .55rem;font-size:12.5px;}
  input,select{width:100%;font-family:inherit;font-size:14px;padding:.35rem .55rem;border:1px solid #ced4da;border-radius:.375rem;}
  label{display:block;font-size:11.5px;font-weight:600;color:#495057;margin:6px 0 2px;}
  .it{border:1px solid #dee2e6;border-radius:.375rem;padding:8px 9px;margin-top:7px;font-size:13.5px;}
  .it.ok{background:#f6fbf8;border-color:#a3cfbb;} .it.no{background:#fff7f7;border-color:#f1aeb5;}
  .it.al{background:#fffdf5;border-color:#ffe69c;}
  .msg{display:none;padding:8px 10px;border-radius:.375rem;font-size:13px;margin-bottom:9px;}
  .msg.s{display:block;background:#d1e7dd;color:#0a3622;} .msg.e{display:block;background:#f8d7da;color:#58151c;}
  .msg.w{display:block;background:#fff3cd;color:#664d03;}
  .hint{font-size:12px;color:#6c757d;margin-top:4px;}
  .lista div{padding:5px 0;border-bottom:1px solid #f1f3f5;font-size:13px;}
  .sug{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #f1f3f5;}
  .sug b{flex:1;font-size:13.5px;}
</style>
<link rel="stylesheet" href="hog-tema.css">
</head>
<body>
<div class="top"><b>HOG Gestão</b> <span id="ctx">painel do contato</span><span class="tel" id="tel"></span></div>
<div class="wrap">
  <div class="msg" id="msg"></div>
  <div id="conteudo"><div class="hint">carregando…</div></div>
</div>

<script>
const SB='https://prztrrtwrunljapnyaci.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByenRycnR3cnVubGphcG55YWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzM4NDQsImV4cCI6MjEwMjg0OTg0NH0.oo0_6LTUFDSKgeclJSv5AJ7Ddk8BAzS18sQh4Fr9NLs';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const g=async p=>{const r=await fetch(SB+'/'+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const po=async(t,o)=>{const r=await fetch(SB+'/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text());return r.json()};
const pa=async(t,q,o)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'PATCH',headers:H,body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text())};
const rpc=async(f,o)=>{const r=await fetch(SB+'/rpc/'+f,{method:'POST',headers:H,body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text());return r.json()};
const E=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const V=i=>{const e=document.getElementById(i);return e?e.value.trim():''};
const brd=s=>s?String(s).split('T')[0].split('-').reverse().join('/'):'';
const say=(c,t)=>{const m=document.getElementById('msg');m.className='msg '+c;m.innerHTML=t};
const digits=s=>String(s||'').replace(/\D/g,'');

/* o DIGISAC abre a integração passando o contato na URL —
   aceitamos os nomes mais comuns para não depender de um só formato */
const Q=new URLSearchParams(location.search);
/* aceita qualquer nome de parâmetro que se pareça com telefone/nome,
   porque cada plataforma nomeia de um jeito */
function achaParam(chaves){
  for(const k of chaves){ const v=Q.get(k); if(v)return v }
  for(const [k,v] of Q.entries()){ if(chaves.some(c=>k.toLowerCase().includes(c.toLowerCase())))return v }
  return '';
}
let TEL=digits(achaParam(['number','telefone','phone','contactNumber','celular','whatsapp']));
let NOME_CONTATO=achaParam(['name','contactName','nome']);
const TICKET=achaParam(['ticketId','ticket','protocolo']);
const DIGISAC_ID=achaParam(['contactId','contact','idContato']);

let CONTATO=null, PACIENTE=null, SOL_ATUAL=null;

/* o DIGISAC pode mandar o contato por postMessage em vez de URL */
window.addEventListener('message',ev=>{
  try{
    const d=typeof ev.data==='string'?JSON.parse(ev.data):ev.data;
    if(!d||typeof d!=='object')return;
    const cand=d.number||d.phone||d.telefone||(d.contact&&(d.contact.number||d.contact.phone))||
               (d.data&&(d.data.number||d.data.phone));
    const log=document.getElementById('pm_log');
    if(log)log.textContent=JSON.stringify(d).slice(0,300);
    if(cand&&!TEL){ TEL=digits(cand);
      NOME_CONTATO=NOME_CONTATO||d.name||(d.contact&&d.contact.name)||'';
      init(); }
  }catch(e){}
});

async function init(){
  document.getElementById('tel').textContent=TEL?fmtTel(TEL):(DIGISAC_ID?'contato '+DIGISAC_ID.slice(0,8):'—');
  if(!TEL && !DIGISAC_ID){ semTelefone(); return }
  try{
    /* O DIGISAC manda o ID do contato, não o telefone.
       Achamos pelo ID; se for a primeira vez, pelo telefone; senão, perguntamos. */
    CONTATO=null;
    if(DIGISAC_ID){
      const porId=await g(`contatos?digisac_contact_id=eq.${encodeURIComponent(DIGISAC_ID)}`).catch(()=>[]);
      CONTATO=porId[0]||null;
    }
    if(!CONTATO && TEL){
      const porTel=await g(`contatos?telefone=eq.${TEL}`).catch(()=>[]);
      CONTATO=porTel[0]||null;
      if(CONTATO && DIGISAC_ID) pa('contatos','id=eq.'+CONTATO.id,{digisac_contact_id:DIGISAC_ID}).catch(()=>{});
    }
    if(!CONTATO){
      const c=await po('contatos',[{telefone:TEL||null,nome:NOME_CONTATO||null,
        digisac_contact_id:DIGISAC_ID||null,ultimo_contato:new Date().toISOString()}]);
      CONTATO=c[0];
    }else{
      if(!CONTATO.telefone && TEL) pa('contatos','id=eq.'+CONTATO.id,{telefone:TEL}).catch(()=>{});
      pa('contatos','id=eq.'+CONTATO.id,{ultimo_contato:new Date().toISOString()}).catch(()=>{});
      TEL=TEL||digits(CONTATO.telefone||'');
      if(TEL)document.getElementById('tel').textContent=fmtTel(TEL);
    }
    /* registra a conversa (chamado) para o histórico */
    if(TICKET){ po('conversas',[{digisac_ticket_id:TICKET,contato_id:CONTATO.id,
      paciente_id:null,digisac_user_id:achaParam(['userId','user'])||null}]).catch(()=>{}) }
    /* pacientes já ligados a este contato */
    const lig=await g(`contato_paciente?select=*,pacientes(*)&contato_id=eq.${CONTATO.id}`).catch(()=>[]);
    if(lig.length===1){ PACIENTE=lig[0].pacientes; await painelPaciente(lig[0].relacao) }
    else if(lig.length>1){ escolhePaciente(lig) }
    else { await identificar() }
  }catch(e){ say('e','Erro: '+E(e.message)) }
}
const fmtTel=t=>t.length>=12?`(${t.slice(2,4)}) ${t.slice(4,-4)}-${t.slice(-4)}`:t;

/* Sem telefone na URL: o painel não trava — a pessoa digita o número
   da conversa (ou busca o paciente pelo nome) e segue normalmente. */
function semTelefone(){
  document.getElementById('ctx').textContent='informe o contato';
  document.getElementById('conteudo').innerHTML=`
    <div class="card">
      <h3>📱 De qual conversa é este atendimento?</h3>
      <div class="hint">A integração ainda não está enviando o telefone na URL.
        Digite o número da conversa — ou busque direto pelo nome do paciente.</div>
      <label style="margin-top:8px">Telefone do contato</label>
      <input id="tel_manual" placeholder="(19) 99999-9999" onkeyup="if(event.key==='Enter')usaTelefone()">
      <button class="b b-p" style="margin-top:7px" onclick="usaTelefone()">Abrir contato</button>
      <label style="margin-top:11px">ou buscar o paciente pelo nome</label>
      <input id="q" placeholder="digite 3 letras" oninput="buscarDireto()">
      <div id="res"></div>
    </div>
    <div class="card" style="background:#f8f9fa">
      <h3>🔧 O que o DIGISAC mandou para esta página</h3>
      <div class="hint" style="font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all">
        ${[...Q.entries()].length?[...Q.entries()].map(([k,v])=>`<b>${E(k)}</b> = ${E(v)}`).join('<br>')
          :'nenhum parâmetro na URL'}<br>
        <span style="color:#6c757d">referrer: ${E(document.referrer||'—')}</span><br>
        <span style="color:#6c757d">postMessage recebido: <span id="pm_log">nenhum ainda</span></span>
      </div>
      <div class="hint">Se aparecer aqui um parâmetro com o telefone, me diga o nome dele que eu ligo automático.</div>
    </div>`;
}
function usaTelefoneOpcional(){
  const t=digits(V("tel_op")); if(t.length<10)return;
  TEL=t.length<=11?("55"+t):t;
  if(CONTATO)pa("contatos","id=eq."+CONTATO.id,{telefone:TEL}).catch(()=>{});
  document.getElementById("tel").textContent=fmtTel(TEL);
  identificar();
}
function usaTelefone(){
  const t=digits(V('tel_manual'));
  if(t.length<10)return say('e','Informe o telefone com DDD.');
  TEL=t.length<=11?('55'+t):t; init();
}
let tmr2=null;
function buscarDireto(){ clearTimeout(tmr2); tmr2=setTimeout(async()=>{
  const q=V('q'); const box=document.getElementById('res'); if(q.length<3){box.innerHTML='';return}
  try{ const r=await g(`pacientes?select=id,nome,nascimento&nome=ilike.*${encodeURIComponent(q)}*&limit=8`);
    box.innerHTML=r.length?r.map(p=>`<div class="sug"><b>${E(p.nome)}</b>
      <span class="tag t-n">${p.nascimento?brd(p.nascimento):'—'}</span>
      <button class="b b-p b-s" onclick="abrirDireto('${p.id}')">abrir</button></div>`).join('')
      :'<div class="hint">Nenhum paciente com esse nome.</div>';
  }catch(e){ box.innerHTML='<div class="hint">Erro na busca.</div>' }
},350)}
async function abrirDireto(pid){ const p=await g(`pacientes?id=eq.${pid}`); PACIENTE=p[0]; await painelPaciente('proprio') }

/* Desfaz o vínculo entre esta conversa e o paciente — para quando alguém
   vincula errado. Não apaga nada do paciente nem do histórico dele. */
async function desvincular(){
  if(!CONTATO||!PACIENTE)return;
  if(!confirm(`Desfazer o vínculo deste contato com ${PACIENTE.nome}?\n\nA conversa volta a pedir identificação. Nada do paciente é apagado.`))return;
  try{
    await fetch(`${SB}/contato_paciente?contato_id=eq.${CONTATO.id}&paciente_id=eq.${PACIENTE.id}`,{method:'DELETE',headers:H});
    if(TICKET) await pa('conversas','digisac_ticket_id=eq.'+TICKET,{paciente_id:null,status:'aberta'}).catch(()=>{});
    PACIENTE=null; say('s','✅ Vínculo desfeito. Identifique o paciente correto abaixo.');
    await identificar();
  }catch(e){ say('e','Erro ao desfazer: '+E(e.message)) }
}

/* ---------- 1) conversa ainda não identificada ---------- */
async function identificar(){
  let sug=[];
  try{ sug=await rpc('fn_sugere_pacientes',{p_telefone:TEL}) }catch(e){ sug=[] }
  document.getElementById('ctx').textContent='identificar paciente';
  document.getElementById('conteudo').innerHTML=`
    <div class="card" style="border-color:#ffc107;background:#fffdf5">
      <h3>🔎 De quem é essa conversa?</h3>
      <div class="hint">${NOME_CONTATO?'WhatsApp de <b>'+E(NOME_CONTATO)+'</b>. ':''}${TEL?'Telefone '+fmtTel(TEL)+'. ':'O DIGISAC manda só o identificador do contato — por isso a primeira vez precisa de você. '}Vincule uma vez: da próxima conversa em diante o sistema reconhece sozinho.</div>
      ${!TEL?`<label style="margin-top:8px">Telefone (opcional, ajuda a achar o paciente)</label>
        <input id="tel_op" placeholder="(19) 99999-9999" onchange="usaTelefoneOpcional()">`:''}
      ${sug.length?`<div style="margin-top:8px">${sug.map(s=>`<div class="sug">
          <b>${E(s.nome)}</b><span class="tag t-n">${E(s.motivo)}</span>
          <button class="b b-g b-s" onclick="ligar('${s.paciente_id}','proprio')">é este paciente</button></div>`).join('')}</div>`
        :'<div class="hint" style="margin-top:6px">Nenhuma sugestão automática para este número.</div>'}
      <label style="margin-top:9px">Buscar paciente pelo nome</label>
      <input id="q" placeholder="digite 3 letras e aguarde" oninput="buscar()">
      <div id="res"></div>
    </div>`;
}
let tmr=null;
function buscar(){ clearTimeout(tmr); tmr=setTimeout(async()=>{
  const q=V('q'); const box=document.getElementById('res'); if(q.length<3){box.innerHTML='';return}
  try{ const r=await g(`pacientes?select=id,nome,nascimento,cpf&nome=ilike.*${encodeURIComponent(q)}*&limit=8`);
    box.innerHTML=r.length?r.map(p=>`<div class="sug"><b>${E(p.nome)}</b>
      <span class="tag t-n">${p.nascimento?brd(p.nascimento):'—'}</span>
      <select id="rel_${p.id}" style="width:auto">
        <option value="proprio">é o próprio</option><option value="filho">filho(a)</option>
        <option value="conjuge">cônjuge</option><option value="cuidador">cuidador(a)</option>
        <option value="responsavel">responsável</option></select>
      <button class="b b-g b-s" onclick="ligar('${p.id}',document.getElementById('rel_${p.id}').value)">vincular</button></div>`).join('')
      :'<div class="hint">Nenhum paciente com esse nome.</div>';
  }catch(e){ box.innerHTML='<div class="hint">Erro na busca.</div>' }
},350)}
async function ligar(pid,rel){
  try{
    await po('contato_paciente',[{contato_id:CONTATO.id,paciente_id:pid,relacao:rel||'responsavel',
      confirmado_por:'atendente DIGISAC'}]).catch(()=>{});
    const p=await g(`pacientes?id=eq.${pid}`); PACIENTE=p[0];
    say('s','✅ Contato vinculado ao paciente. Nas próximas conversas o sistema já reconhece.');
    await painelPaciente(rel);
  }catch(e){ say('e','Erro ao ligar: '+E(e.message)) }
}
function escolhePaciente(lig){
  document.getElementById('ctx').textContent='qual paciente?';
  document.getElementById('conteudo').innerHTML=`<div class="card"><h3>👥 Este contato cuida de mais de um paciente</h3>
    ${lig.map(l=>`<div class="sug"><b>${E(l.pacientes.nome)}</b>
      <span class="tag t-b">${E(l.relacao)}</span>
      <button class="b b-p b-s" onclick="abrir('${l.paciente_id}','${E(l.relacao)}')">abrir</button></div>`).join('')}</div>`;
}
async function abrir(pid,rel){ const p=await g(`pacientes?id=eq.${pid}`); PACIENTE=p[0]; await painelPaciente(rel) }

/* ---------- 2) painel do paciente ---------- */
async function painelPaciente(rel){
  const p=PACIENTE; document.getElementById('ctx').textContent='paciente identificado';
  let pend=[],ags=[],vis=[],aut=[];
  try{ pend=await g(`vw_pendencias_paciente?paciente_id=eq.${p.id}`) }catch(e){}
  try{ ags=await g(`agendamentos?paciente_id=eq.${p.id}&status=in.(agendado,aguardando)&select=data,hora,tipo,status,agendas_logicas(nome),medicos(nome)&order=data&limit=6`) }catch(e){}
  try{ vis=await g(`agendamentos?paciente_id=eq.${p.id}&status=in.(compareceu,realizado,faltou)&select=data,status,tipo,medicos(nome)&order=data.desc&limit=5`) }catch(e){}
  try{ aut=await g(`vw_saldo_autorizacao?paciente_id=eq.${p.id}`) }catch(e){}
  let pre=[]; try{ pre=await g(`vw_pre_reservas?paciente_id=eq.${p.id}`) }catch(e){}
  const faltas=vis.filter(v=>v.status==='faltou').length;
  document.getElementById('conteudo').innerHTML=`
  <div class="card">
    <div class="pac">${E(p.nome)}</div>
    <div class="sub">${p.nascimento?brd(p.nascimento)+' · ':''}${p.cpf?'CPF '+E(p.cpf):'<b style="color:#b02a37">sem CPF</b>'}
      ${p.sobe_escada===false?' · <span class="tag t-a">não sobe escada</span>':''}
      ${rel&&rel!=='proprio'?' · <span class="tag t-b">falando: '+E(rel)+'</span>':''}
      ${faltas?' · <span class="tag t-r">'+faltas+' falta(s)</span>':''}</div>
    <div style="margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="hint" style="margin:0">Não é este paciente?</span>
      <button class="b b-n b-s" onclick="desvincular()">desfazer vínculo</button>
    </div>
  </div>

  <div class="card">
    <h3>📋 Aguardando agendamento ${pend.length?'<span class="tag t-a">'+pend.length+'</span>':''}</h3>
    ${pend.length?pend.map(x=>`<div class="it ${x.pode_agendar?'ok':(x.requisicao_vencida?'no':'al')}">
        <b>${E(x.item||'—')}</b>${x.lateralidade?' ('+E(x.lateralidade)+')':''}
        ${x.medico_solicitante?'<br><span class="hint">pedido por '+E(x.medico_solicitante)+'</span>':''}
        <br>${x.numero_requisicao?'Requisição <b>'+E(x.numero_requisicao)+'</b>':'<b>sem requisição</b>'}
        ${x.requisicao_validade?' · vale até '+brd(x.requisicao_validade):''}
        ${x.observacao_proximo_agendamento?'<br><i>💬 '+E(x.observacao_proximo_agendamento)+'</i>':''}
        <br><b>${x.pode_agendar?'✓ pode agendar':'⛔ '+E(x.impedimento||'')}</b>
        ${!x.pode_agendar?`<button class="b b-w b-s" style="margin-left:6px" onclick="pedirGuia('${x.solicitacao_id}')">registrar requisição</button>`:''}
      </div>`).join('')
      :'<div class="hint">Nada pendente pedido pelo médico.</div>'}
  </div>

  ${aut.length?`<div class="card"><h3>🎫 Autorizações do convênio</h3>
    ${aut.map(a=>`<div class="it ${a.saldo>0?'ok':'no'}">
      <b>${E(a.item||'')}</b> · autorizado ${a.quantidade_autorizada}, usado ${a.quantidade_utilizada},
      <b>saldo ${a.saldo}</b>${a.validade?' · vale até '+brd(a.validade):''}
      ${a.numero_requisicao?'<br>Guia '+E(a.numero_requisicao):''}${a.senha_autorizacao?' · senha '+E(a.senha_autorizacao):''}
      ${a.fotos?' · <span class="tag t-g">'+a.fotos+' foto(s)</span>':' · <span class="tag t-a">sem foto</span>'}</div>`).join('')}
    </div>`:''}

  <div class="card">
    <h3>📅 Próximos agendamentos</h3>
    <div class="lista">${ags.length?ags.map(a=>`<div>${brd(a.data)} ${String(a.hora||'').slice(0,5)} ·
      ${E((a.agendas_logicas&&a.agendas_logicas.nome)||a.tipo||'')} ${a.medicos?'· '+E(a.medicos.nome):''}
      <span class="tag t-b">${E(a.status)}</span>
      <button class="b b-n b-s" style="margin-left:6px" onclick="reagendar('${a.id}','${a.agenda_logica_id||''}','${a.data}','${String(a.hora||'').slice(0,5)}')">reagendar</button>
      </div>`).join(''):'<div class="hint">Nenhum agendamento futuro.</div>'}</div>
  </div>

  <div class="card">
    <h3>🕘 Últimas visitas</h3>
    <div class="lista">${vis.length?vis.map(v=>`<div>${brd(v.data)} · ${E(v.tipo||'')}
      ${v.medicos?'· '+E(v.medicos.nome):''}
      <span class="tag ${v.status==='faltou'?'t-r':'t-g'}">${v.status==='faltou'?'faltou':'compareceu'}</span></div>`).join('')
      :'<div class="hint">Sem histórico.</div>'}</div>
  </div>

  ${pre.length?`<div class="card" style="border-color:#ffc107;background:#fffdf5">
    <h3>🔒 Horários segurados para este paciente</h3>
    ${pre.map(x=>`<div class="it al">
      <b>${brd(x.data)} às ${String(x.hora).slice(0,5)}</b> · ${E(x.agenda||'')}
      <br><span class="hint">segurado por ${E(x.criado_por||'—')} · ${x.vencida?'<b style="color:#b02a37">venceu</b>':'expira em <b>'+x.horas_restantes+'h</b>'}</span>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="b b-g b-s" onclick="confirmarPre('${x.id}')">confirmar agendamento</button>
        <button class="b b-n b-s" onclick="liberarPre('${x.id}')">liberar horário</button>
      </div></div>`).join('')}
  </div>`:''}

  <div class="card" id="cd_agendar">
    <h3>📆 Resolver aqui mesmo</h3>
    <label>Agenda</label>
    <select id="ag_sel" onchange="verVagas()"><option value="">— escolha —</option>
      ${(REF_AG||[]).map(a=>`<option value="${a.id}">${E(a.nome)}</option>`).join('')}</select>
    <div class="g2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px">
      <div><label>Data</label><input type="date" id="ag_data" onchange="verVagas()"></div>
      <div><label>Hora</label><input type="time" id="ag_hora" value="08:00"></div>
    </div>
    <div class="hint" id="ag_vaga" style="margin-top:6px"></div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="b b-g" onclick="agendarAqui()">Agendar</button>
      <button class="b" style="background:#ffc107;color:#3d3000" onclick="preReservar()">🔒 Pré-reservar e oferecer</button>
      <button class="b b-w" onclick="esperaAqui()">📋 Lista de espera</button>
      <button class="b b-n" onclick="novaGuia()">+ Registrar guia</button>
    </div>
  </div>

  <div class="card">
    <h3>✅ Fechar o atendimento</h3>
    <div class="hint">Registra o que saiu desta conversa e manda a confirmação para o paciente.</div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="b b-g" onclick="confirmarPorWhats()">💬 Enviar confirmação</button>
      <button class="b b-n" onclick="resolverConversa()">Marcar como resolvida</button>
    </div>
    <div class="hint" id="res_msg" style="margin-top:6px"></div>
  </div>`;
}

/* ---------- resolver a solicitação sem sair da conversa ---------- */
let REF_AG=[], ULTIMO_AG=null;
(async()=>{ try{ REF_AG=await g('agendas_logicas?select=id,nome,medico_id,tipo,qtd_periodo&ativo=is.true&order=nome') }catch(e){} })();

async function verVagas(){
  const box=document.getElementById('ag_vaga'); if(!box)return;
  const ag=V('ag_sel'), d=V('ag_data'); if(!ag||!d){box.innerHTML='';return}
  try{
    const r=await rpc('fn_tem_vaga',{p_agenda:ag,p_data:d});
    const v=Array.isArray(r)?r[0]:r;
    if(!v){box.innerHTML='';return}
    box.innerHTML = v.livre>0
      ? `<span class="tag t-g">${v.livre} vaga(s) livre(s)</span> ${v.agendados} de ${v.vagas}${v.extras?` (+${v.extras} extras)`:''}`
      : `<span class="tag t-r">agenda lotada</span> ${v.agendados} de ${v.vagas} — use a <b>lista de espera</b>`;
  }catch(e){ box.innerHTML='<span class="tag t-n">sem controle de vaga nesta agenda</span>' }
}
async function agendarAqui(){
  const ag=V('ag_sel'), d=V('ag_data'), h=V('ag_hora');
  if(!ag||!d||!h)return say('e','Escolha agenda, data e hora.');
  const a=REF_AG.find(x=>x.id===ag);
  try{
    const r=await rpc('fn_tem_vaga',{p_agenda:ag,p_data:d}); const v=Array.isArray(r)?r[0]:r;
    if(v && v.vagas>0 && v.livre<=0) return say('e','Agenda lotada. Use a lista de espera — o encaixe só pela coordenação.');
  }catch(e){}
  try{
    const novo=await po('agendamentos',[{paciente_id:PACIENTE.id,agenda_logica_id:ag,medico_id:a?a.medico_id:null,
      tipo:(a&&a.tipo==='exame_medico')?'exame':(a?a.tipo:'consulta'),data:d,hora:h,status:'agendado',
      criado_por:'call center (DIGISAC)',observacao:'agendado pela conversa do WhatsApp'}]);
    ULTIMO_AG=novo[0];
    if(REAGENDANDO){
      await pa('agendamentos','id=eq.'+REAGENDANDO,{status:'cancelado',
        motivo_cancelamento:'reagendado pelo call center',cancelado_por:'call center (DIGISAC)',
        cancelado_em:new Date().toISOString()}).catch(()=>{});
      await pa('agendamentos','id=eq.'+novo[0].id,{reagendamento_de:REAGENDANDO,
        motivo_reagendamento:'paciente_pediu'}).catch(()=>{});
      REAGENDANDO=null;
    }
    if(SOL_ATUAL) await pa('solicitacoes','id=eq.'+SOL_ATUAL.solicitacao_id,{status:'agendado',
      agendado_por:'call center (DIGISAC)',agendado_em:new Date().toISOString(),agendamento_id:novo[0].id}).catch(()=>{});
    if(TICKET) await pa('conversas','digisac_ticket_id=eq.'+TICKET,{paciente_id:PACIENTE.id,agendamento_id:novo[0].id,
      assunto:'agendamento',status:'identificada'}).catch(()=>{});
    say('s','✅ Agendado para '+brd(d)+' às '+h+'. Agora envie a confirmação ao paciente.');
    await painelPaciente();
  }catch(e){ say('e','Erro ao agendar: '+E(e.message)) }
}
async function esperaAqui(){
  const ag=V('ag_sel'); if(!ag)return say('e','Escolha a agenda para entrar na espera.');
  const a=REF_AG.find(x=>x.id===ag);
  const urg=confirm('Marcar como URGENTE?\n\nOK = urgente · Cancelar = normal');
  try{
    await po('lista_espera',[{paciente_id:PACIENTE.id,agenda_logica_id:ag,medico_id:a?a.medico_id:null,
      tipo:'consulta',prioridade:urg?'urgente':'normal',status:'aguardando',
      telefone:TEL||null,observacao:'pediu pelo WhatsApp; agenda sem vaga'}]);
    say('s','✅ Na lista de espera. Quando a coordenação liberar data, o call center é avisado.');
  }catch(e){ say('e','Erro: '+E(e.message)) }
}
/* manda a confirmação pela própria conversa do DIGISAC */
async function confirmarPorWhats(){
  const box=document.getElementById('res_msg');
  try{
    const ags=ULTIMO_AG?[ULTIMO_AG]:await g(`agendamentos?paciente_id=eq.${PACIENTE.id}&status=eq.agendado&select=data,hora,medicos(nome),agendas_logicas(nome)&order=data&limit=1`);
    if(!ags.length){box.innerHTML='Nenhum agendamento futuro para confirmar.';return}
    const a=ags[0];
    const mod=await g('modelos_mensagem?id=eq.conf_consulta&select=texto').catch(()=>[]);
    const par={}; (await g('parametros_sistema?select=chave,valor').catch(()=>[])).forEach(p=>par[p.chave]=p.valor);
    const dd=new Date(a.data+'T12:00:00');
    const DS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
    let txt=(mod[0]&&mod[0].texto)||'Olá, {{paciente}}! Sua consulta está agendada para {{data}} às {{hora}}.';
    txt=txt.replace(/{{paciente}}/g,(PACIENTE.nome||'').split(' ')[0])
           .replace(/{{paciente_completo}}/g,PACIENTE.nome||'')
           .replace(/{{data}}/g,brd(a.data)).replace(/{{dia_semana}}/g,DS[dd.getDay()])
           .replace(/{{hora}}/g,String(a.hora||'').slice(0,5))
           .replace(/{{medico}}/g,(a.medicos&&a.medicos.nome)||'')
           .replace(/{{agenda}}/g,(a.agendas_logicas&&a.agendas_logicas.nome)||'')
           .replace(/{{clinica}}/g,par.clinica_nome||'Hospital dos Olhos Guanabara')
           .replace(/{{endereco}}/g,par.clinica_endereco||'');
    box.innerHTML='enviando…';
    const r=await fetch('https://prztrrtwrunljapnyaci.supabase.co/functions/v1/digisac-send',
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({contactId:DIGISAC_ID||undefined,number:DIGISAC_ID?undefined:TEL,
         text:txt,paciente_id:PACIENTE.id,modelo_id:'conf_consulta',dontOpenTicket:false})});
    const j=await r.json();
    box.innerHTML=j.ok?'✅ Confirmação enviada pela conversa.':'⚠ Não enviou: '+E(JSON.stringify(j.resposta||j).slice(0,160));
  }catch(e){ box.innerHTML='Erro: '+E(e.message) }
}
/* ---------- pré-reserva: segura o horário enquanto o paciente decide ---------- */
async function preReservar(){
  const ag=V('ag_sel'), d=V('ag_data'), h=V('ag_hora');
  if(!ag||!d||!h)return say('e','Escolha agenda, data e hora para segurar.');
  const a=REF_AG.find(x=>x.id===ag);
  let horas=24; try{ const p=await g("parametros_sistema?chave=eq.pre_reserva_horas&select=valor"); horas=parseInt(p[0]&&p[0].valor)||24 }catch(e){}
  try{
    const r=await po('pre_reservas',[{paciente_id:PACIENTE.id,contato_id:CONTATO?CONTATO.id:null,
      agenda_logica_id:ag,medico_id:a?a.medico_id:null,data:d,hora:h,
      criado_por:'call center (DIGISAC)',
      expira_em:new Date(Date.now()+horas*3600e3).toISOString(),
      observacao:'oferecido ao paciente pelo WhatsApp'}]);
    say('s',`🔒 Horário segurado até ${new Date(r[0].expira_em).toLocaleString('pt-BR')}. Ninguém mais consegue oferecer esse horário.`);
    await painelPaciente();
  }catch(e){
    const m=String(e.message||'');
    say('e', m.includes('ux_prereserva_slot')
      ? '⚠ Esse horário já está segurado por outro atendente. Escolha outro.'
      : 'Erro ao segurar: '+E(m));
  }
}
async function confirmarPre(id){
  try{
    const pr=(await g(`pre_reservas?id=eq.${id}`))[0]; if(!pr)return;
    const a=REF_AG.find(x=>x.id===pr.agenda_logica_id);
    const novo=await po('agendamentos',[{paciente_id:pr.paciente_id,agenda_logica_id:pr.agenda_logica_id,
      medico_id:pr.medico_id,tipo:(a&&a.tipo==='exame_medico')?'exame':(a?a.tipo:'consulta'),
      data:pr.data,hora:pr.hora,status:'agendado',criado_por:'call center (DIGISAC)',
      observacao:'confirmado a partir de pré-reserva'}]);
    await pa('pre_reservas','id=eq.'+id,{status:'convertida',agendamento_id:novo[0].id,
      encerrado_em:new Date().toISOString(),encerrado_por:'call center'});
    ULTIMO_AG=novo[0];
    say('s','✅ Agendamento confirmado. Envie a confirmação ao paciente.');
    await painelPaciente();
  }catch(e){ say('e','Erro: '+E(e.message)) }
}
async function liberarPre(id){
  if(!confirm('Liberar este horário? Ele volta a ficar disponível para qualquer atendente.'))return;
  try{ await pa('pre_reservas','id=eq.'+id,{status:'liberada',encerrado_em:new Date().toISOString(),encerrado_por:'call center'});
    say('s','Horário liberado.'); await painelPaciente();
  }catch(e){ say('e','Erro: '+E(e.message)) }
}
async function reagendar(id,ag,data,hora){
  document.getElementById('ag_sel').value=ag||'';
  document.getElementById('ag_data').value='';
  document.getElementById('ag_hora').value=hora||'08:00';
  REAGENDANDO=id;
  await verVagas();
  say('w',`Reagendando o atendimento de ${brd(data)} ${hora}. Escolha a nova data e clique em <b>Agendar</b> — o antigo é cancelado automaticamente.`);
  document.getElementById('cd_agendar').scrollIntoView({behavior:'smooth'});
}
let REAGENDANDO=null;

async function resolverConversa(){
  try{
    if(TICKET) await pa('conversas','digisac_ticket_id=eq.'+TICKET,{status:'resolvida',fechada_em:new Date().toISOString()});
    document.getElementById('res_msg').innerHTML='✅ Conversa marcada como resolvida no HOG Gestão.';
  }catch(e){ document.getElementById('res_msg').innerHTML='Erro: '+E(e.message) }
}

/* ---------- 3) registrar a guia que chegou em foto ---------- */
function novaGuia(){ pedirGuia(null) }
async function pedirGuia(solId){
  const num=prompt('Número da requisição (o que está na guia):'); if(!num)return;
  const item=prompt('Procedimento/exame autorizado (como está na guia):')||'';
  const qtd=parseInt(prompt('Quantidade autorizada:','1'))||1;
  const val=prompt('Validade (aaaa-mm-dd):','');
  const foto=prompt('Link da foto recebida no WhatsApp (opcional):','');
  try{
    const a=await po('autorizacoes',[{paciente_id:PACIENTE.id,numero_requisicao:num,validade:val||null,
      origem:'digisac',telefone_origem:TEL,observacao:'registrada pelo painel do DIGISAC'}]);
    const it=await po('autorizacao_itens',[{autorizacao_id:a[0].id,descricao:item,quantidade_autorizada:qtd}]);
    if(foto)await po('anexos',[{tipo:'requisicao',autorizacao_id:a[0].id,paciente_id:PACIENTE.id,
      url:foto,origem:'digisac',recebido_por:'atendente'}]).catch(()=>{});
    if(solId)await pa('solicitacoes','id=eq.'+solId,{numero_requisicao:num,requisicao_validade:val||null,
      autorizacao_item_id:it[0].id,autorizacao_status:'autorizada'}).catch(()=>{});
    say('s','✅ Guia registrada e ligada ao paciente.');
    await painelPaciente();
  }catch(e){ say('e','Erro: '+E(e.message)) }
}

init();
</script>
