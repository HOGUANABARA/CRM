<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOG Gestão — Horários segurados</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#212529;font-size:16px;}
  .status{position:absolute;right:12px;top:9px;font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;}
  .ok{background:#d1e7dd;color:#0a3622;} .er{background:#f8d7da;color:#58151c;} .ld{background:#fff3cd;color:#664d03;}
  .daybar{background:#dce9f7;padding:9px 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid #c5d9ee;}
  .bl{background:#0d6efd;color:#fff;border:none;padding:.375rem .75rem;border-radius:.375rem;font-size:15px;cursor:pointer;}
  .bl.n{background:#6c757d;} .bl.g{background:#198754;} .bl.w{background:#fd7e14;}
  .head{padding:11px 14px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .titulo{background:#ffc107;color:#3d3000;padding:.4rem .9rem;border-radius:.375rem;font-size:15px;font-weight:600;}
  .kpis{display:flex;gap:8px;padding:0 14px 10px;flex-wrap:wrap;}
  .k{background:#f8f9fa;border:1px solid #dee2e6;border-radius:.375rem;padding:.4rem .85rem;min-width:104px;text-align:center;}
  .k .n{font-size:20px;font-weight:700;} .k .l{font-size:10px;color:#6c757d;text-transform:uppercase;}
  .k.al{background:#fff3cd;border-color:#ffc107;} .k.al .n{color:#664d03;}
  .k.r{background:#f8d7da;border-color:#f1aeb5;} .k.r .n{color:#58151c;}
  .wrap{padding:0 14px 40px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:13px;padding:.5rem;border-bottom:2px solid #dee2e6;white-space:nowrap;}
  td{font-size:14px;padding:.5rem;border-bottom:1px solid #dee2e6;vertical-align:middle;}
  tr.venc{background:#fff8f8;} tr.avisa{background:#fffdf5;}
  .tag{display:inline-block;padding:.15rem .5rem;border-radius:.375rem;font-size:11.5px;font-weight:600;}
  .t-g{background:#d1e7dd;color:#0a3622;} .t-a{background:#fff3cd;color:#664d03;}
  .t-r{background:#f8d7da;color:#58151c;} .t-n{background:#e9ecef;color:#495057;}
  .b{border:none;border-radius:.25rem;font-size:13px;padding:.25rem .6rem;cursor:pointer;font-weight:500;}
  .b-g{background:#198754;color:#fff;} .b-n{background:#e9ecef;color:#495057;} .b-w{background:#fd7e14;color:#fff;}
  .alerta{background:#fff3cd;border:1px solid #ffe69c;color:#664d03;border-radius:.375rem;padding:9px 12px;margin:10px 0;font-size:14px;}
  .alerta.r{background:#f8d7da;border-color:#f1aeb5;color:#58151c;}
  .vazio{color:#adb5bd;font-style:italic;padding:14px 2px;}
  .hint{font-size:12.5px;color:#6c757d;}
</style>
<link rel="stylesheet" href="hog-tema.css">
</head>
<body>
<span id="st" class="status ld">conectando…</span>
<div class="daybar">
  <button class="bl" onclick="load()">↻ Atualizar</button>
  <button class="bl n" onclick="expirar()">⏱ Expirar os vencidos</button>
  <span class="hint">A lista se atualiza sozinha a cada minuto.</span>
</div>
<div class="head"><span class="titulo">🔒 Horários segurados (pré-reservas)</span>
  <span class="hint">O atendente ofereceu a data ao paciente e o horário fica bloqueado até a resposta.</span></div>
<div class="kpis" id="kpis"></div>
<div class="wrap"><div id="alertas"></div><div id="ct"></div></div>

<script>
const SB='https://prztrrtwrunljapnyaci.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByenRycnR3cnVubGphcG55YWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzM4NDQsImV4cCI6MjEwMjg0OTg0NH0.oo0_6LTUFDSKgeclJSv5AJ7Ddk8BAzS18sQh4Fr9NLs';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const g=async p=>{const r=await fetch(SB+'/'+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const po=async(t,o)=>{const r=await fetch(SB+'/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text());return r.json()};
const pa=async(t,q,o)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'PATCH',headers:H,body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text())};
const rpc=async(f,o)=>{const r=await fetch(SB+'/rpc/'+f,{method:'POST',headers:H,body:JSON.stringify(o||{})});if(!r.ok)throw new Error(await r.text());return r.json()};
const E=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const stat=(c,t)=>{const s=document.getElementById('st');s.className='status '+c;s.textContent=t};
const brd=s=>s?String(s).split('T')[0].split('-').reverse().join('/'):'';
const hhmm=s=>String(s||'').slice(0,5);
let PRE=[];

const FN='https://prztrrtwrunljapnyaci.supabase.co/functions/v1';
let CFG={};
async function load(){try{
  stat('ld','carregando…');
  PRE=await g('vw_pre_reservas?select=*');
  if(!CFG.digisac_base){ try{ (await g('parametros_sistema?select=chave,valor')).forEach(p=>CFG[p.chave]=p.valor) }catch(e){} }
  render(); stat('ok','● conectado');
  checaRespostas();
}catch(e){ document.getElementById('ct').innerHTML='<div class="alerta r">Erro: '+E(e.message)+'</div>'; stat('er','● erro') }}

/* Pergunta ao DIGISAC se o paciente respondeu depois que o horário foi oferecido.
   Sem deep link para a conversa, é assim que a coordenação sabe se pode fechar. */
async function checaRespostas(){
  for(const x of PRE){
    const cel=document.getElementById('rsp_'+x.id); if(!cel)continue;
    if(!x.contato_id){ cel.innerHTML='<span class="hint">sem contato vinculado</span>'; continue }
    try{
      const c=(await g(`contatos?id=eq.${x.contato_id}&select=digisac_contact_id`))[0];
      if(!c||!c.digisac_contact_id){ cel.innerHTML='<span class="hint">contato sem WhatsApp</span>'; continue }
      cel.innerHTML='<span class="hint">consultando…</span>';
      const r=await fetch(`${FN}/digisac-conversa?contactId=${encodeURIComponent(c.digisac_contact_id)}&desde=${encodeURIComponent(x.criado_em)}`);
      const j=await r.json();
      if(j.respondeu){
        const t=j.ultima_resposta;
        cel.innerHTML=`<span class="tag t-g">respondeu</span><br><span class="hint">“${E(String(t.texto||'').slice(0,60))}” · ${new Date(t.quando).toLocaleString('pt-BR')}</span>`;
      }else{
        cel.innerHTML=`<span class="tag t-a">sem resposta</span><br><span class="hint">desde que o horário foi oferecido</span>`;
      }
    }catch(e){ cel.innerHTML='<span class="hint">não consegui consultar</span>' }
  }
}
function abreDigisac(){
  const base=(CFG.digisac_base||'https://hoguanabara.digisac.biz').replace(/\/$/,'');
  window.open(base,'_blank');
}

function render(){
  const venc=PRE.filter(x=>x.vencida), avisa=PRE.filter(x=>x.vencendo);
  document.getElementById('kpis').innerHTML=
    `<div class="k"><div class="n">${PRE.length}</div><div class="l">Segurados agora</div></div>`+
    `<div class="k ${avisa.length?'al':''}"><div class="n">${avisa.length}</div><div class="l">Vencem em 4h</div></div>`+
    `<div class="k ${venc.length?'r':''}"><div class="n">${venc.length}</div><div class="l">Já venceram</div></div>`;

  let al='';
  if(venc.length)
    al+=`<div class="alerta r">⏰ <b>${venc.length} horário(s) venceram</b> sem resposta do paciente.
      Decida: confirmar mesmo assim ou liberar para outro paciente. Enquanto ficam assim, a vaga segue bloqueada.</div>`;
  if(avisa.length)
    al+=`<div class="alerta">⚠️ <b>${avisa.length} vencem nas próximas 4 horas.</b> Depois de 24h a janela do WhatsApp
      fecha e o paciente não recebe mais mensagem sem custo — vale cobrar a resposta agora.</div>`;
  document.getElementById('alertas').innerHTML=al;

  if(!PRE.length){document.getElementById('ct').innerHTML='<div class="vazio">Nenhum horário segurado no momento.</div>';return}
  document.getElementById('ct').innerHTML=
    `<table><thead><tr><th>Quando</th><th>Paciente</th><th>Agenda / médico</th><th>Segurado por</th>
      <th>Prazo</th><th>Situação</th><th>Resposta no WhatsApp</th><th></th></tr></thead><tbody>`+
    PRE.map(x=>`<tr class="${x.vencida?'venc':(x.vencendo?'avisa':'')}">
      <td><b>${brd(x.data)}</b> ${hhmm(x.hora)}</td>
      <td>${E(x.paciente||'—')}${x.telefone?'<br><span class="hint">'+E(x.telefone)+'</span>':''}</td>
      <td>${E(x.agenda||'—')}${x.medico?'<br><span class="hint">'+E(x.medico)+'</span>':''}</td>
      <td>${E(x.criado_por||'—')}<br><span class="hint">${new Date(x.criado_em).toLocaleString('pt-BR')}</span></td>
      <td>${x.vencida?'<span class="tag t-r">venceu</span>':'<b>'+x.horas_restantes+'h</b>'}<br>
          <span class="hint">até ${new Date(x.expira_em).toLocaleString('pt-BR')}</span></td>
      <td>${x.vencida?'<span class="tag t-r">prazo esgotado</span>':(x.vencendo?'<span class="tag t-a">cobrar resposta</span>':'<span class="tag t-g">aguardando</span>')}</td>
      <td id="rsp_${x.id}"><span class="hint">…</span></td>
      <td style="white-space:nowrap">
        <button class="b b-g" onclick="confirmar('${x.id}')">confirmar</button>
        <button class="b b-n" style="margin-left:4px" onclick="liberar('${x.id}')">liberar</button>
        <button class="b b-w" style="margin-left:4px" onclick="prorrogar('${x.id}')">+24h</button>
        <button class="b" style="margin-left:4px;background:#2c4a80;color:#fff" onclick="abreDigisac()">💬 DIGISAC</button>
      </td></tr>`).join('')+'</tbody></table>';
}

async function confirmar(id){
  try{
    const pr=(await g(`pre_reservas?id=eq.${id}`))[0]; if(!pr)return;
    const ag=(await g(`agendas_logicas?id=eq.${pr.agenda_logica_id}&select=tipo,medico_id`))[0]||{};
    const novo=await po('agendamentos',[{paciente_id:pr.paciente_id,agenda_logica_id:pr.agenda_logica_id,
      medico_id:pr.medico_id||ag.medico_id,tipo:ag.tipo==='exame_medico'?'exame':(ag.tipo||'consulta'),
      data:pr.data,hora:pr.hora,status:'agendado',criado_por:'coordenação',
      observacao:'confirmado pela coordenação a partir de pré-reserva'}]);
    await pa('pre_reservas','id=eq.'+id,{status:'convertida',agendamento_id:novo[0].id,
      encerrado_em:new Date().toISOString(),encerrado_por:'coordenação'});
    load();
  }catch(e){ alert('Erro: '+e.message) }
}
async function liberar(id){
  if(!confirm('Liberar este horário? Ele volta a ficar disponível para qualquer atendente.'))return;
  try{ await pa('pre_reservas','id=eq.'+id,{status:'liberada',encerrado_em:new Date().toISOString(),encerrado_por:'coordenação'}); load() }
  catch(e){ alert('Erro: '+e.message) }
}
async function prorrogar(id){
  try{ const pr=(await g(`pre_reservas?id=eq.${id}`))[0];
    const novo=new Date(Math.max(Date.now(),new Date(pr.expira_em).getTime())+24*3600e3);
    await pa('pre_reservas','id=eq.'+id,{expira_em:novo.toISOString()}); load() }
  catch(e){ alert('Erro: '+e.message) }
}
async function expirar(){
  try{ const n=await rpc('fn_expira_pre_reservas'); alert(n+' pré-reserva(s) expirada(s) e horário(s) devolvido(s).'); load() }
  catch(e){ alert('Erro: '+e.message) }
}
load(); setInterval(load,60000);
</script>
</body>
</html>
