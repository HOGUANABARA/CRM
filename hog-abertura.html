<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOG Gestão — Grade do HOG</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#212529;font-size:16px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .status{position:absolute;right:12px;top:9px;font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;z-index:60;}
  .ok{background:#d1e7dd;color:#0a3622;} .er{background:#f8d7da;color:#58151c;} .ld{background:#fff3cd;color:#664d03;}
  .daybar{background:#dce9f7;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;border-bottom:1px solid #c5d9ee;}
  .bl{background:#0d6efd;color:#fff;border:none;padding:.375rem .75rem;border-radius:.375rem;font-size:15px;cursor:pointer;}
  .bl.g{background:#198754;} .bl.n{background:#6c757d;} .bl.o{background:#fff;color:#0d6efd;border:1px solid #0d6efd;}
  .bl.w{background:#fd7e14;}
  .seg{display:flex;border:1px solid #0d6efd;border-radius:.375rem;overflow:hidden;}
  .seg button{background:#fff;color:#0d6efd;border:none;padding:.35rem .8rem;font-size:14px;cursor:pointer;}
  .seg button.on{background:#0d6efd;color:#fff;font-weight:600;}
  .mes{font-size:19px;font-weight:600;margin:0 4px;}
  .nav{background:#fff;border:1px solid #c5d9ee;color:#1a3d5c;width:31px;height:31px;border-radius:50%;cursor:pointer;font-size:16px;}
  .sino{position:relative;}
  .sino .badge{position:absolute;top:-6px;right:-7px;background:#dc3545;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:700;}
  .leg{display:flex;gap:9px;align-items:center;margin-left:auto;flex-wrap:wrap;font-size:12px;color:#1a3d5c;}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08);}
  .filtros{padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dee2e6;flex-shrink:0;}
  .filtros select{font-size:14px;padding:.25rem .5rem;border:1px solid #ced4da;border-radius:.375rem;}
  .hint{font-size:12px;color:#6c757d;}
  .kpis{display:flex;gap:8px;padding:6px 12px;flex-wrap:wrap;flex-shrink:0;}
  .k{background:#f8f9fa;border:1px solid #dee2e6;border-radius:.375rem;padding:.35rem .8rem;min-width:90px;text-align:center;}
  .k .n{font-size:18px;font-weight:700;} .k .l{font-size:10px;color:#6c757d;text-transform:uppercase;}
  .k.al{background:#fff3cd;border-color:#ffc107;} .k.al .n{color:#664d03;}
  .k.v{background:#e8f5ec;border-color:#a3cfbb;} .k.v .n{color:#0a3622;}

  /* ---------- grade ---------- */
  .calwrap{flex:1;overflow:auto;border-top:1px solid #dee2e6;}
  .calhead{display:grid;position:sticky;top:0;background:#fff;z-index:20;border-bottom:1px solid #dee2e6;}
  .calhead .gz{border-right:1px solid #e9ecef;}
  .dh{text-align:center;padding:6px 3px 8px;border-right:1px solid #e9ecef;}
  .dh .dn{font-size:11px;color:#6c757d;text-transform:uppercase;letter-spacing:.5px;}
  .dh .dd{font-size:22px;color:#3c4043;line-height:1.25;}
  .dh .sl{font-size:14px;font-weight:600;color:#3c4043;line-height:1.2;}
  .dh .sh{font-size:11px;color:#6c757d;}
  .dh.hoje .dd{background:#1a73e8;color:#fff;border-radius:50%;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;}
  .dh.hoje .dn{color:#1a73e8;font-weight:700;} .dh.fds{background:#fafafa;}
  .cal{display:grid;position:relative;}
  .gutter{border-right:1px solid #e9ecef;}
  .gutter div{height:44px;font-size:11px;color:#70757a;text-align:right;padding-right:6px;transform:translateY(-7px);}
  .dcol{border-right:1px solid #e9ecef;position:relative;cursor:copy;background:#f8f9fa;}
  .hl{height:44px;border-bottom:1px solid #e9ecef;}
  .aberto{position:absolute;left:0;right:0;background:#eef8f1;border-top:1px solid #cde8d8;border-bottom:1px solid #cde8d8;}
  .aberto span{position:absolute;top:4px;left:6px;font-size:10.5px;color:#4b7f60;letter-spacing:.3px;}
  .ev{position:absolute;border-radius:4px;color:#fff;font-size:11.5px;line-height:1.2;padding:3px 5px;overflow:hidden;cursor:pointer;
      border:1px solid rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:5;}
  .ev b{font-weight:600;display:block;} .ev .h{opacity:.92;font-size:11px;}
  .ev.manha{background:#EF6C00;} .ev.tarde{background:#009688;} .ev.cirurgico{background:#7CB342;}
  .ev.vaga{background:#8E24AA;} .ev.atencao{background:#D50000;}
  .ev.pre{box-shadow:inset 4px 0 0 #FFC107,0 1px 2px rgba(0,0,0,.18);}
  .ev .pin{position:absolute;right:3px;top:2px;font-size:10px;}
  .agora{position:absolute;left:0;right:0;height:2px;background:#EA4335;z-index:15;}
  .agora::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#EA4335;}

  /* ---------- painel ---------- */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:70;} .ov.on{display:block;}
  .pn{position:fixed;top:0;right:0;bottom:0;width:450px;max-width:96vw;background:#fff;z-index:71;display:none;flex-direction:column;box-shadow:-6px 0 22px rgba(0,0,0,.18);}
  .pn.on{display:flex;}
  .ph{padding:11px 14px;border-bottom:1px solid #dee2e6;display:flex;align-items:center;gap:8px;}
  .ph b{font-size:17px;flex:1;} .ph button{background:none;border:none;font-size:19px;cursor:pointer;color:#6c757d;}
  .pb{flex:1;overflow-y:auto;padding:12px 14px;}
  .pf{padding:10px 14px;border-top:1px solid #dee2e6;display:flex;gap:8px;flex-wrap:wrap;}
  .et{border:1px solid #dee2e6;border-radius:.375rem;padding:10px 12px;margin-bottom:10px;}
  .et.lib{border-color:#a3cfbb;background:#f6fbf8;}
  .et h3{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .et h3 .num{background:#0d6efd;color:#fff;min-width:19px;height:19px;padding:0 5px;border-radius:9px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
  .et.lib h3 .num{background:#198754;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  label{display:block;font-size:11.5px;font-weight:600;color:#495057;margin-bottom:2px;}
  input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:.35rem .55rem;border:1px solid #ced4da;border-radius:.375rem;color:#212529;background:#fff;}
  input:focus,select:focus{outline:0;border-color:#86b7fe;box-shadow:0 0 0 .2rem rgba(13,110,253,.25);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid #ced4da;border-radius:999px;padding:.26rem .68rem;font-size:13px;cursor:pointer;background:#fff;}
  .chip.on{background:#0d6efd;border-color:#0d6efd;color:#fff;font-weight:600;}
  .chip.mult.on{background:#198754;border-color:#198754;}
  .msg{display:none;padding:8px 10px;border-radius:.375rem;font-size:13px;margin-bottom:10px;}
  .msg.s{display:block;background:#d1e7dd;color:#0a3622;} .msg.e{display:block;background:#f8d7da;color:#58151c;}
  .msg.w{display:block;background:#fff3cd;color:#664d03;}
  .tag{display:inline-block;padding:.15rem .5rem;border-radius:.375rem;font-size:11.5px;font-weight:600;}
  .t-a{background:#fff3cd;color:#664d03;} .t-g{background:#d1e7dd;color:#0a3622;}
  .t-n{background:#e9ecef;color:#495057;} .t-b{background:#cfe2ff;color:#052c65;} .t-r{background:#f8d7da;color:#58151c;}
  .esp{background:#fff;border:1px solid #dee2e6;border-radius:.375rem;padding:7px 9px;margin-top:7px;font-size:13px;}
  @media(max-width:900px){.calwrap{overflow-x:auto;}}
  @media print{.daybar,.filtros,.status,.pn,.ov,.kpis{display:none!important} .calwrap{overflow:visible}}
</style>
<link rel="stylesheet" href="hog-tema.css">
</head>
<body>
<span id="st" class="status ld">conectando…</span>

<div class="daybar">
  <div class="seg">
    <button data-m="dia" class="on" onclick="setModo('dia')">Dia · por local</button>
    <button data-m="semana" onclick="setModo('semana')">Semana</button>
  </div>
  <button class="bl o" onclick="hoje()">Hoje</button>
  <button class="nav" onclick="anda(-1)">&lsaquo;</button>
  <button class="nav" onclick="anda(1)">&rsaquo;</button>
  <span class="mes" id="mes"></span>
  <button class="bl w" onclick="definirSalas()" title="O número do consultório é definido na véspera">&#127968; Consultórios de amanhã</button>
  <button class="bl n" onclick="copiarSemana()">&#9109; Copiar semana anterior</button>
  <span class="sino"><button class="bl o" onclick="verAlertas()">&#128276; Avisos ao call center</button><span class="badge" id="badge" style="display:none">0</span></span>
  <span class="leg">
    <span><i style="background:#eef8f1;border-color:#cde8d8"></i>Disponível</span>
    <span><i style="background:#EF6C00"></i>Manhã</span>
    <span><i style="background:#009688"></i>Tarde</span>
    <span><i style="background:#7CB342"></i>Centro Cirúrgico</span>
    <span><i style="background:#8E24AA"></i>Externo</span>
    <span><i style="background:#FFC107"></i>Reservado, não liberado</span>
  </span>
</div>

<div class="filtros">
  <span id="f_wrap_sala"><select id="f_sala" onchange="render()"><option value="">Todos os locais</option></select></span>
  <select id="f_med" onchange="render()"><option value="">Todos os médicos</option></select>
  <select id="f_est" onchange="render()">
    <option value="">Reservados e liberados</option>
    <option value="pre_programado">Só reservados (não liberados)</option>
    <option value="liberado">Só liberados</option>
    <option value="bloqueado">Bloqueados</option>
  </select>
  <span class="hint">Todo local nasce <b>disponível</b> no horário de funcionamento. Clique em cima do verde para <b>reservar</b>.</span>
</div>
<div class="kpis" id="kpis"></div>

<div class="calwrap">
  <div class="calhead" id="calhead"></div>
  <div class="cal" id="cal"></div>
</div>

<div class="ov" id="ov" onclick="fecha()"></div>
<div class="pn" id="pn">
  <div class="ph"><b id="pt">Reserva</b><button onclick="fecha()">&#10005;</button></div>
  <div class="pb" id="pb"></div>
  <div class="pf" id="pf"></div>
</div>

<script>
const SB='https://prztrrtwrunljapnyaci.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByenRycnR3cnVubGphcG55YWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzM4NDQsImV4cCI6MjEwMjg0OTg0NH0.oo0_6LTUFDSKgeclJSv5AJ7Ddk8BAzS18sQh4Fr9NLs';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const g=async p=>{const r=await fetch(SB+'/'+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const po=async(t,o)=>{const r=await fetch(SB+'/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text());return r.json()};
const pa=async(t,q,o)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'PATCH',headers:H,body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text())};
const de=async(t,q)=>{const r=await fetch(SB+'/'+t+'?'+q,{method:'DELETE',headers:H});if(!r.ok)throw new Error(await r.text())};
const E=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const V=i=>{const e=document.getElementById(i);return e?e.value.trim():''};
const stat=(c,t)=>{const s=document.getElementById('st');s.className='status '+c;s.textContent=t};
const iso=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10)};
const brd=s=>s?s.split('-').reverse().join('/'):'';
const DIAS=['DOM.','SEG.','TER.','QUA.','QUI.','SEX.','SÁB.'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const H0=6, H1=20, PXH=44;
const m2h=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const hm2m=s=>{if(!s)return null;const p=String(s).split(':');return (+p[0])*60+(+p[1])};

let REF={salas:[],medicos:[],agendas:[],pgto:[],contratos:[],perfis:[]},
    RES=[], ALERTAS=[], ESPERA=[], MODO='dia', DIA=new Date(), INI=null, SEL=null,
    FALTA_SQL=false, FALTA_GRADE=false;

/* ---------------- datas ---------------- */
function domingo(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());return x}
function diasSemana(){const a=[];for(let i=0;i<7;i++){const d=new Date(INI);d.setDate(d.getDate()+i);a.push(d)}return a}
const hoje=()=>{DIA=new Date();INI=domingo(DIA);load()};
function anda(n){ if(MODO==='dia'){const d=new Date(DIA);d.setDate(d.getDate()+n);DIA=d;INI=domingo(d)}
  else{INI.setDate(INI.getDate()+7*n);DIA=new Date(INI)} load() }
function setModo(m){MODO=m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.getElementById('f_wrap_sala').style.display=m==='dia'?'none':'inline';load()}

/* ---------------- carga ---------------- */
async function loadRef(){
  const [s,m,a,p,c,pf]=await Promise.all([
    g('salas?select=*&order=nome'), g('medicos?select=id,nome,tipo&order=nome'),
    g('agendas_logicas?select=*&order=nome'),
    g('formas_pagamento_agenda?select=*&order=nome').catch(()=>[]),
    g('contratos?select=*&ativo=is.true&order=nome').catch(()=>[]),
    g('perfis?select=id,nome&order=nome').catch(()=>[])]);
  if(!p.length)p.push({id:'contrato',nome:'Conforme contrato'},{id:'repasse',nome:'Repasse ao médico'},
    {id:'aluguel_sala',nome:'Aluguel de sala'},{id:'producao',nome:'Produção'},
    {id:'preceptor',nome:'Residente — repasse ao preceptor'},{id:'sem_pagamento',nome:'Sem pagamento'});
  FALTA_GRADE = s.length>0 && !('hora_abre' in s[0]);
  const ativos=s.filter(x=>x.ativo!==false);
  ativos.forEach(x=>{ if(!x.hora_abre)x.hora_abre='07:00'; if(!x.hora_fecha)x.hora_fecha='19:00'; if(x.ordem==null)x.ordem=50 });
  ativos.sort((a,b)=>(a.ordem-b.ordem)||a.nome.localeCompare(b.nome));
  REF={salas:ativos,medicos:m,agendas:a,pgto:p,contratos:c,perfis:pf};
  document.getElementById('f_sala').innerHTML='<option value="">Todos os locais</option>'+ativos.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`).join('');
  document.getElementById('f_med').innerHTML='<option value="">Todos os médicos</option>'+m.map(x=>`<option value="${x.id}">${E(x.nome)}</option>`).join('');
}
async function load(){try{
  stat('ld','carregando…');
  let d0,d1;
  if(MODO==='dia'){ d0=d1=iso(DIA) } else { const ds=diasSemana(); d0=iso(ds[0]); d1=iso(ds[6]) }
  const [res,amostra,al,esp]=await Promise.all([
    g(`reservas?select=*&data=gte.${d0}&data=lte.${d1}&order=data`),
    g('reservas?select=*&limit=1'),
    g('alertas_call_center?select=*&status=eq.pendente&order=criado_em.desc').catch(()=>[]),
    g('lista_espera?select=*,pacientes(nome,telefone)&order=entrou_em').catch(()=>[])]);
  RES=res; ALERTAS=al; ESPERA=esp;
  FALTA_SQL = amostra.length>0 && !('hora_ini' in amostra[0]);
  const b=document.getElementById('badge');
  b.style.display=ALERTAS.length?'inline':'none'; b.textContent=ALERTAS.length;
  render(); stat('ok','● conectado');
}catch(e){stat('er','● erro');alert('Erro ao carregar: '+e.message)}}

/* ---------------- helpers ---------------- */
const nomeMed=id=>{const m=REF.medicos.find(x=>x.id===id);return m?m.nome:''};
const nomeSala=id=>{const s=REF.salas.find(x=>x.id===id);return s?s.nome:''};
const nomeAg=id=>{const a=REF.agendas.find(x=>x.id===id);return a?a.nome:''};
const tituloDe=r=>r.titulo||nomeAg(r.agenda_logica_id)||nomeMed(r.medico_id)||'Reservado';
function corDe(r){
  if(r.cor)return r.cor;
  if(r.turno==='cirurgico')return 'cirurgico';
  if(!r.medico_id)return 'vaga';
  const i=hm2m(r.hora_ini);
  if(i!=null)return i<720?'manha':'tarde';
  return r.turno==='tarde'?'tarde':'manha';
}
function janela(r){
  let i=hm2m(r.hora_ini), f=hm2m(r.hora_fim);
  if(i==null)i = r.turno==='tarde'?13*60 : r.turno==='cirurgico'?12*60 : 7*60+30;
  if(f==null)f = r.turno==='manha'?11*60+30 : i+240;
  return {i,f:Math.max(f,i+30)};
}
function filtra(){
  let L=RES.slice();
  if(MODO==='semana'&&V('f_sala'))L=L.filter(r=>r.sala_id===V('f_sala'));
  if(V('f_med'))L=L.filter(r=>r.medico_id===V('f_med'));
  if(V('f_est'))L=L.filter(r=>r.estado===V('f_est'));
  else L=L.filter(r=>r.estado!=='bloqueado'||true);
  return L;
}

/* ---------------- grade ---------------- */
function render(){
  const L=filtra();
  const alt=(H1-H0)*PXH, hj=iso(new Date());
  let gut='<div class="gutter">'; for(let h=H0;h<H1;h++)gut+=`<div>${h}:00</div>`; gut+='</div>';
  let cols='', head='<div class="gz"></div>', ncols;

  if(MODO==='dia'){
    const dstr=iso(DIA), dd=new Date(dstr+'T12:00:00');
    document.getElementById('mes').textContent=
      `${DIAS[dd.getDay()].replace('.','')} , ${dd.getDate()} de ${MES[dd.getMonth()]}`.replace(' ,',',');
    const salas=REF.salas;
    ncols=salas.length;
    salas.forEach(s=>{ head+=`<div class="dh"><div class="sl">${E(s.nome)}</div>
      <div class="sh">${String(s.hora_abre).slice(0,5)}–${String(s.hora_fecha).slice(0,5)}</div></div>` });
    salas.forEach(s=>{
      const evs=L.filter(r=>r.data===dstr&&r.sala_id===s.id);
      cols+=coluna(s,dstr,evs,dstr===hj);
    });
  }else{
    const ds=diasSemana();
    document.getElementById('mes').textContent=MES[ds[3].getMonth()]+' de '+ds[3].getFullYear();
    ncols=7;
    ds.forEach(d=>{const f=(d.getDay()===0||d.getDay()===6)?' fds':'';
      head+=`<div class="dh${iso(d)===hj?' hoje':''}${f}"><div class="dn">${DIAS[d.getDay()]}</div><div class="dd">${d.getDate()}</div></div>`});
    const sala=V('f_sala')?REF.salas.find(x=>x.id===V('f_sala')):null;
    ds.forEach(d=>{ const dstr=iso(d);
      cols+=coluna(sala,dstr,L.filter(r=>r.data===dstr),dstr===hj) });
  }
  const gt=`56px repeat(${ncols},minmax(112px,1fr))`;
  document.getElementById('calhead').style.gridTemplateColumns=gt;
  document.getElementById('cal').style.gridTemplateColumns=gt;
  document.getElementById('calhead').innerHTML=head;
  document.getElementById('cal').innerHTML=gut+cols;
  kpis(L);
}
function coluna(sala,dstr,evs,ehHoje){
  const alt=(H1-H0)*PXH;
  let linhas=''; for(let h=H0;h<H1;h++)linhas+='<div class="hl"></div>';
  let disp='';
  const jan=[];
  if(sala){ jan.push({s:sala,i:hm2m(sala.hora_abre),f:hm2m(sala.hora_fecha)}) }
  else { const a=Math.min(...REF.salas.map(x=>hm2m(x.hora_abre)||420)), b=Math.max(...REF.salas.map(x=>hm2m(x.hora_fecha)||1140));
         jan.push({s:null,i:a,f:b}) }
  jan.forEach(j=>{ const top=(j.i-H0*60)/60*PXH, h=(j.f-j.i)/60*PXH;
    disp+=`<div class="aberto" style="top:${top}px;height:${h}px"><span>disponível</span></div>` });
  const blocos=posiciona(evs);
  const agora=ehHoje?linhaAgora():'';
  const dataSala=sala?`data-s="${sala.id}"`:'';
  return `<div class="dcol" style="height:${alt}px" data-d="${dstr}" ${dataSala}
    onclick="cliqueVazio(event,'${dstr}','${sala?sala.id:''}')">${linhas}${disp}${agora}${blocos}</div>`;
}
function linhaAgora(){const n=new Date(),m=n.getHours()*60+n.getMinutes();
  if(m<H0*60||m>H1*60)return '';return `<div class="agora" style="top:${(m-H0*60)/60*PXH}px"></div>`}
function posiciona(lista){
  const evs=lista.map(r=>{const j=janela(r);return {r,i:j.i,f:j.f}}).sort((a,b)=>a.i-b.i||a.f-b.f);
  let out='',grupo=[],fimG=-1;
  const solta=()=>{ if(!grupo.length)return; const faixas=[];
    grupo.forEach(e=>{let k=faixas.findIndex(ff=>ff<=e.i); if(k<0)k=faixas.length; faixas[k]=e.f; e.lane=k});
    const n=faixas.length; grupo.forEach(e=>{out+=bloco(e,n)}); grupo=[]; fimG=-1 };
  evs.forEach(e=>{ if(grupo.length&&e.i>=fimG)solta(); grupo.push(e); fimG=Math.max(fimG,e.f) });
  solta(); return out;
}
function bloco(e,n){
  const r=e.r, top=(e.i-H0*60)/60*PXH, h=Math.max((e.f-e.i)/60*PXH-2,17), w=100/n, left=e.lane*w;
  const bloq=r.estado==='bloqueado', cls=bloq?'atencao':corDe(r);
  const pre=r.estado==='pre_programado'?' pre':'';
  const pin=r.estado==='liberado'?'✓':(bloq?'⛔':'⏳');
  const extra=r.recorrencia==='extra'?' ⚡':(r.recorrencia==='recorrente'?' ⟳':'');
  const loc=MODO==='dia'?'':(r.sala_id?E(nomeSala(r.sala_id)):'🏠 sala a definir');
  return `<div class="ev ${cls}${pre}" style="top:${top}px;height:${h}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px)"
    onclick="event.stopPropagation();editar('${r.id}')" title="${E(tituloDe(r))}">
    <span class="pin">${pin}</span><b>${E(tituloDe(r))}${extra}</b>
    <span class="h">${m2h(e.i)}–${m2h(e.f)}${loc?' · '+loc:''}</span></div>`;
}
function kpis(L){
  const salas=REF.salas.length, dias=MODO==='dia'?1:7;
  const lib=L.filter(r=>r.estado==='liberado').length, pre=L.filter(r=>r.estado==='pre_programado').length;
  const amanha=iso(new Date(Date.now()+864e5));
  const semSala=L.filter(r=>!r.sala_id&&r.medico_id&&r.estado!=='bloqueado').length;
  const semSalaAmanha=L.filter(r=>r.data===amanha&&!r.sala_id&&r.medico_id&&r.estado!=='bloqueado').length;
  /* minutos disponíveis x reservados */
  let capMin=0; REF.salas.forEach(s=>{capMin+=((hm2m(s.hora_fecha)-hm2m(s.hora_abre))||720)*dias});
  let usadoMin=0; L.filter(r=>r.estado!=='bloqueado').forEach(r=>{const j=janela(r);usadoMin+=j.f-j.i});
  const livre=Math.max(capMin-usadoMin,0), pctLivre=capMin?Math.round(livre/capMin*100):0;
  document.getElementById('kpis').innerHTML=
    `<div class="k v"><div class="n">${pctLivre}%</div><div class="l">Grade livre (${salas} locais)</div></div>`+
    `<div class="k"><div class="n">${Math.round(livre/60)}h</div><div class="l">Horas disponíveis</div></div>`+
    `<div class="k"><div class="n">${L.length}</div><div class="l">Reservas</div></div>`+
    `<div class="k"><div class="n">${lib}</div><div class="l">Liberadas p/ agendar</div></div>`+
    `<div class="k ${pre?'al':''}"><div class="n">${pre}</div><div class="l">Reservadas, não liberadas</div></div>`+
    `<div class="k ${semSalaAmanha?'al':''}" style="cursor:pointer" onclick="definirSalas()"><div class="n">${semSala}</div>`+
      `<div class="l">Sem consultório${semSalaAmanha?' · '+semSalaAmanha+' é amanhã':''}</div></div>`+
    (FALTA_GRADE?`<div class="k al" style="min-width:auto"><div class="l">⚠ rode hog-grade.sql</div></div>`:'')+
    (FALTA_SQL?`<div class="k al" style="min-width:auto"><div class="l">⚠ rode hog-abertura-agenda.sql</div></div>`:'');
}

/* ---------------- 1) RESERVAR (poucos campos) ---------------- */

  SEL={id:null,data:dstr,sala_id:salaId||'',hora_ini:m2h(min),hora_fim:m2h(Math.min(min+240,H1*60)),
       recorrencia:'recorrente',estado:'pre_programado',medico_id:'',agenda_logica_id:''};
  painelReserva();
}
function editar(id){SEL=RES.find(r=>r.id===id);if(SEL)painelReserva()}
function fecha(){document.getElementById('pn').classList.remove('on');document.getElementById('ov').classList.remove('on')}

function pick(box,el){document.querySelectorAll('#'+box+' .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on')}
function marca(box,v){const el=document.querySelector('#'+box+' .chip[data-v="'+v+'"]');
  if(el)pick(box,el);else{const f=document.querySelector('#'+box+' .chip');if(f)pick(box,f)}}
function val(box){const el=document.querySelector('#'+box+' .chip.on');return el?el.dataset.v:''}
function mostraRepete(){document.getElementById('bx_repete').style.display=val('ch_rec')==='recorrente'?'block':'none'}
function marcaPerfis(r){
  let lista=r.perfis_agendamento;
  if(!lista||!lista.length){ const s=REF.salas.find(x=>x.id===(r.sala_id||V('sala_id')));
    lista=(s&&s.agendavel_por&&s.agendavel_por.length)?s.agendavel_por
      :((s&&s.tipo==='cc')?['centro_cirurgico','consultora','coordenacao']:['callcenter','recepcao','coordenacao']) }
  document.querySelectorAll('#ch_perfis .chip').forEach(c=>c.classList.toggle('on',lista.includes(c.dataset.v)));
}
const perfisSel=()=>[...document.querySelectorAll('#ch_perfis .chip.on')].map(c=>c.dataset.v);

/* ---- padrão e contrato ---- */
function aplicaPadrao(){
  const a=REF.agendas.find(x=>x.id===V('agenda_logica_id')); if(!a)return;
  if(a.contrato_id){document.getElementById('pagamento_tipo').value='contrato';mostraContrato(a.contrato_id)}
  if(a.medico_id&&!V('medico_id'))document.getElementById('medico_id').value=a.medico_id;
  if(!V('titulo'))document.getElementById('titulo').value=a.nome;
  document.getElementById('hint_padrao').innerHTML=
    `<b>${E(a.nome)}</b> · ${E(a.tipo||'—')} · ${E(a.modo_contagem||'—')}`+
    (a.tempo_atendimento_min?` · ${a.tempo_atendimento_min} min por paciente`:'')+
    (a.qtd_periodo?` · ${a.qtd_periodo} vagas no período`:'')+
    (a.cota_nao_sobe_escada?` · cota ${a.cota_nao_sobe_escada} que não sobem escada`:'');
  mostraEspera();
}
const RTIPO={repasse_percentual:'repasse',valor_fixo_periodo:'valor fixo por período',valor_por_atendimento:'valor por atendimento',
  aluguel_sala:'aluguel de sala',preceptoria:'preceptoria (repasse ao preceptor)',sem_pagamento:'sem pagamento'};
const moeda=v=>v==null?'':('R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2}));
function contratoDoPadrao(){const a=REF.agendas.find(x=>x.id===V('agenda_logica_id'));return a&&a.contrato_id?a.contrato_id:''}
function mostraContrato(preferido){

function resumoContrato(){
  const c=REF.contratos.find(x=>x.id===V('contrato_id')), h=document.getElementById('hint_contrato');
  if(!c){h.innerHTML=REF.contratos.length?'O contrato fica <b>vinculado ao padrão de atendimento</b>.'
    :'⚠ Nenhum contrato cadastrado — rode <b>hog-contratos.sql</b>.';return}
  h.innerHTML=`<b>${E(c.nome)}</b> · ${RTIPO[c.tipo_remuneracao]||E(c.tipo_remuneracao||'—')}`+

    (contratoDoPadrao()===c.id?' <span class="tag t-g">vinculado ao padrão</span>':' <span class="tag t-a">será vinculado ao padrão</span>');
}
/* ---- espera: quem está esperando essa agenda ---- */
function mostraEspera(){
  const box=document.getElementById('bx_espera'); if(!box)return;
  const ag=V('agenda_logica_id'), med=V('medico_id');
  const fila=ESPERA.filter(e=>e.status!=='agendado'&&((ag&&e.agenda_logica_id===ag)||(med&&e.medico_id===med)));
  box.innerHTML=fila.length?`<div class="esp">🔔 <b>${fila.length} paciente(s) na lista de espera</b> desta agenda.
    Ao liberar, o call center recebe o aviso para chamar:<br>${fila.slice(0,6).map(e=>
      `${E(e.pacientes?e.pacientes.nome:'—')}${e.prioridade==='urgente'?' <span class="tag t-r">urgente</span>':''}`).join(' · ')}</div>`:'';
}

/* ---------------- salvar / liberar ---------------- */
function corpo(liberar){
  const sala=REF.salas.find(x=>x.id===V('sala_id'));
  const i=hm2m(V('hora_ini'));
  const cor = (sala&&sala.tipo==='cc')?'cirurgico' : (!V('medico_id')?'vaga' : (i!=null&&i<720?'manha':'tarde'));
  const o={ medico_id:V('medico_id')||null, sala_id:V('sala_id')||null, data:V('data'),
    recorrencia:val('ch_rec'), hora_extra:document.getElementById('hora_extra').checked,
    observacao:V('observacao')||null, turno:cor==='vaga'?null:cor,
    agenda_logica_id:V('agenda_logica_id')||null };
  if(!FALTA_SQL)Object.assign(o,{hora_ini:V('hora_ini')||null,hora_fim:V('hora_fim')||null,
    titulo:V('titulo')||null,cor:cor,pagamento_tipo:V('pagamento_tipo')||null,
    pagamento_valor:parseFloat((V('pagamento_valor')||'').replace(/[^0-9,.-]/g,'').replace(',','.'))||null});
  if(V('pagamento_tipo')==='contrato'&&REF.contratos.length)o.contrato_id=V('contrato_id')||null;
  if(!FALTA_GRADE)o.perfis_agendamento=perfisSel();
  return o;
}
async function salvar(liberar){
  try{
    if(!V('data'))return say('e','Informe a data.');
    if(!V('sala_id'))return say('e','Escolha o local.');
    if(!V('hora_ini')||!V('hora_fim'))return say('e','Informe início e fim.');
    if(hm2m(V('hora_fim'))<=hm2m(V('hora_ini')))return say('e','O fim precisa ser depois do início.');
    /* choque de horário no mesmo local */
    const i=hm2m(V('hora_ini')), f=hm2m(V('hora_fim'));
    const choque=RES.find(r=>r.id!==(SEL.id||'')&&r.data===V('data')&&r.sala_id===V('sala_id')&&r.estado!=='bloqueado'
      &&(()=>{const j=janela(r);return i<j.f&&f>j.i})());
    if(choque)return say('e',`Esse horário já está reservado em ${E(nomeSala(V('sala_id')))}: <b>${E(tituloDe(choque))}</b>.`);

    if(liberar){
      if(!V('agenda_logica_id'))return say('e','Para liberar, associe o padrão de atendimento.');
      if(!V('pagamento_tipo'))return say('e','Para liberar, informe o pagamento.');
      if(V('pagamento_tipo')==='contrato'&&REF.contratos.length&&!V('contrato_id'))
        return say('e','Escolha o contrato do médico.');
      if(!perfisSel().length)return say('e','Escolha quem pode agendar neste bloco.');
      if(V('pagamento_tipo')==='contrato'&&V('contrato_id')&&contratoDoPadrao()!==V('contrato_id')){
        try{ await pa('agendas_logicas','id=eq.'+V('agenda_logica_id'),{contrato_id:V('contrato_id')});
             const a=REF.agendas.find(x=>x.id===V('agenda_logica_id')); if(a)a.contrato_id=V('contrato_id') }catch(e){}
      }
    }
    const o=corpo(liberar);
    o.estado = liberar?'liberado':(SEL.estado==='liberado'?'liberado':'pre_programado');
    if(liberar&&!FALTA_SQL){o.liberado_por='coordenação';o.liberado_em=new Date().toISOString()}

    let ids=[];
    if(SEL.id){ await pa('reservas','id=eq.'+SEL.id,o); ids=[SEL.id] }
    else{
      const linhas=[o];
      if(val('ch_rec')==='recorrente'&&V('repete_ate')){
        let d=new Date(o.data+'T12:00:00'); const fim=new Date(V('repete_ate')+'T12:00:00');
        while(true){ d.setDate(d.getDate()+7); if(d>fim)break; linhas.push({...o,data:iso(d)}) }
      }
      const criados=await po('reservas',linhas); ids=criados.map(x=>x.id);
    }
    let aviso='';
    if(liberar) aviso=await avisaCallCenter(o,ids);
    fecha(); await load();
    if(aviso)alert(aviso);
  }catch(e){ say('e','Erro ao salvar: '+E(e.message)) }
}
/* ---- alerta ao call center: quem esperava essa agenda ---- */
async function avisaCallCenter(o,ids){
  if(!o.agenda_logica_id&&!o.medico_id)return '';
  const fila=ESPERA.filter(e=>e.status!=='agendado'&&
    ((o.agenda_logica_id&&e.agenda_logica_id===o.agenda_logica_id)||(o.medico_id&&e.medico_id===o.medico_id)));
  const nome=nomeAg(o.agenda_logica_id)||nomeMed(o.medico_id);
  const linhas=[{tipo:'agenda_liberada',reserva_id:ids[0]||null,agenda_logica_id:o.agenda_logica_id,
    medico_id:o.medico_id,data_agenda:o.data,paciente_id:null,
    mensagem:`Agenda liberada: ${nome} em ${brd(o.data)} ${o.hora_ini?String(o.hora_ini).slice(0,5):''}. ${fila.length?fila.length+' paciente(s) na lista de espera.':'Sem lista de espera.'}`,
    status:'pendente'}];
  fila.forEach(e=>linhas.push({tipo:'agenda_liberada',reserva_id:ids[0]||null,agenda_logica_id:o.agenda_logica_id,
    medico_id:o.medico_id,data_agenda:o.data,paciente_id:e.paciente_id,
    mensagem:`${e.pacientes?e.pacientes.nome:'Paciente'} está na espera de ${nome}${e.prioridade==='urgente'?' (URGENTE)':''} — agenda liberada em ${brd(o.data)}.`,
    status:'pendente'}));
  try{ await po('alertas_call_center',linhas);
    for(const e of fila){ try{ await pa('lista_espera','id=eq.'+e.id,{status:'avisado',avisado_em:new Date().toISOString()}) }catch(_){} }
    return fila.length?`✅ Agenda liberada. O call center foi avisado sobre ${fila.length} paciente(s) da lista de espera.`
                      :'✅ Agenda liberada e o call center foi avisado.';
  }catch(err){ return '✅ Agenda liberada. (Avisos ao call center exigem o hog-grade.sql.)' }
}
async function bloquear(){
  const m=prompt('Motivo do bloqueio (falta, congresso, férias…):'); if(m===null)return;
  try{ await pa('reservas','id=eq.'+SEL.id,{estado:'bloqueado',motivo_bloqueio:m}); fecha(); load() }catch(e){ say('e','Erro: '+E(e.message)) }
}
async function excluir(){
  if(!confirm('Excluir esta reserva? O horário volta a ficar disponível.'))return;
  try{ await de('reservas','id=eq.'+SEL.id); fecha(); load() }catch(e){ say('e','Erro: '+E(e.message)) }
}

/* ---------------- avisos ao call center ---------------- */
function verAlertas(){
  document.getElementById('pt').textContent='Avisos ao call center';
  document.getElementById('pb').innerHTML=`<div class="msg" id="msg"></div>`+
    (ALERTAS.length?ALERTAS.map(a=>`<div class="et" style="padding:9px 11px">
        <div style="font-size:13.5px">${E(a.mensagem)}</div>
        <div style="margin-top:6px;display:flex;gap:6px;align-items:center">
          <span class="tag t-n">${brd(a.data_agenda)}</span>
          <button class="bl g" style="padding:.2rem .6rem;font-size:13px" onclick="tratar('${a.id}')">✓ tratado</button>
        </div></div>`).join('')
      :'<div class="hint">Nenhum aviso pendente. Quando uma agenda for liberada, os pacientes da lista de espera aparecem aqui.</div>');
  document.getElementById('pf').innerHTML=`<button class="bl n" onclick="fecha()">Fechar</button>`+
    (ALERTAS.length?`<button class="bl" onclick="tratarTodos()">Marcar todos como tratados</button>`:'');
  document.getElementById('pn').classList.add('on');document.getElementById('ov').classList.add('on');
}
async function tratar(id){ try{ await pa('alertas_call_center','id=eq.'+id,{status:'tratado',tratado_em:new Date().toISOString(),tratado_por:'call center'});
  await load(); verAlertas() }catch(e){ say('e','Erro: '+E(e.message)) } }
async function tratarTodos(){ try{ for(const a of ALERTAS)await pa('alertas_call_center','id=eq.'+a.id,{status:'tratado',tratado_em:new Date().toISOString(),tratado_por:'call center'});
  await load(); fecha() }catch(e){ say('e','Erro: '+E(e.message)) } }

/* ---------------- consultórios da véspera ---------------- */
function definirSalas(dstr){
  const d=dstr||iso(new Date(Date.now()+864e5));
  const lista=RES.filter(r=>r.data===d&&r.estado!=='bloqueado').sort((a,b)=>String(a.hora_ini||'').localeCompare(String(b.hora_ini||'')));
  const dd=new Date(d+'T12:00:00');
  const opts=s=>'<option value="">— a definir —</option>'+REF.salas.map(x=>`<option value="${x.id}"${x.id===s?' selected':''}>${E(x.nome)}</option>`).join('');
  document.getElementById('pt').textContent='Consultórios de '+dd.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
  document.getElementById('pb').innerHTML=`<div class="msg" id="msg"></div>
    <div class="et"><h3><span class="num">🏠</span> Definição da véspera</h3>
      <div class="hint">O número do consultório é definido no dia anterior. Ajuste e salve — recepção, call center e painel de senhas passam a mostrar o local certo.</div>
      <div style="margin-top:8px"><label>Dia</label><input type="date" id="dia_salas" value="${d}" onchange="definirSalas(this.value)"></div></div>
    ${lista.length?lista.map((r,i)=>`<div class="et" style="padding:8px 10px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="tag ${r.sala_id?'t-g':'t-a'}">${r.hora_ini?String(r.hora_ini).slice(0,5):'—'}</span>
        <b style="flex:1;font-size:13.5px">${E(tituloDe(r))}</b>
        <span class="tag t-n">${r.estado==='liberado'?'liberada':'reservada'}</span></div>
      <select id="sl_${i}" data-id="${r.id}" style="margin-top:6px">${opts(r.sala_id)}</select></div>`).join('')
      :'<div class="hint">Nenhuma reserva neste dia.</div>'}`;
  document.getElementById('pf').innerHTML=lista.length
    ?`<button class="bl g" onclick="salvarSalas(${lista.length})">Salvar consultórios</button><button class="bl n" onclick="fecha()">Fechar</button>`
    :`<button class="bl n" onclick="fecha()">Fechar</button>`;
  document.getElementById('pn').classList.add('on');document.getElementById('ov').classList.add('on');
}
async function salvarSalas(n){
  try{ let mudou=0;
    for(let i=0;i<n;i++){ const el=document.getElementById('sl_'+i); if(!el)continue;
      const r=RES.find(x=>x.id===el.dataset.id); if(!r)continue;
      const novo=el.value||null; if((r.sala_id||null)===novo)continue;
      const o={sala_id:novo};
      if(!FALTA_SQL)Object.assign(o,{sala_definida_por:'coordenação',sala_definida_em:new Date().toISOString()});
      try{ await pa('reservas','id=eq.'+r.id,o) }catch(e){ await pa('reservas','id=eq.'+r.id,{sala_id:novo}) }
      mudou++; }
    fecha(); load(); if(!mudou)alert('Nenhuma alteração para salvar.');
  }catch(e){ say('e','Erro ao salvar: '+E(e.message)) }
}

async function copiarSemana(){
  const base=MODO==='dia'?domingo(DIA):INI;
  const a0=new Date(base); a0.setDate(a0.getDate()-7);
  const a6=new Date(a0); a6.setDate(a6.getDate()+6);
  try{
    const ant=await g(`reservas?select=*&data=gte.${iso(a0)}&data=lte.${iso(a6)}&recorrencia=eq.recorrente`);
    if(!ant.length)return alert('A semana anterior não tem reservas recorrentes para copiar.');
    if(!confirm(`Copiar ${ant.length} reserva(s) recorrente(s) da semana anterior?\nElas entram como reservadas, ainda sem liberação.`))return;
    const novos=ant.map(r=>{const o={...r};delete o.id;delete o.liberado_por;delete o.liberado_em;
      const d=new Date(r.data+'T12:00:00');d.setDate(d.getDate()+7);return {...o,data:iso(d),estado:'pre_programado'}});
    await po('reservas',novos); load();
  }catch(e){ alert('Erro ao copiar: '+e.message) }
}

(async()=>{ INI=domingo(new Date()); await loadRef(); await load(); })();
</script>
